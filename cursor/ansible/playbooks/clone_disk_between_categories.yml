                time.sleep(delay)
            return {"vm_ext_id": vm_ext_id, "disk_ext_id": disk_ext_id, "success": False, "status": last_status, "error": last_error or "poll timeout"}

        results = []
        failed = []
        processed = 0
        total = len(poll_targets)
        print(f"PROGRESS stage=clone_attr_poll total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
