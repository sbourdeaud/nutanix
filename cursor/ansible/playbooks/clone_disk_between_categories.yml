    - name: "Apply source custom attributes concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import uuid
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["CLONE_ATTR_SUBMIT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["CLONE_ATTR_SUBMIT_BASE_URL"]
        username = os.environ["CLONE_ATTR_SUBMIT_USERNAME"]
        password = os.environ["CLONE_ATTR_SUBMIT_PASSWORD"]
        retries = int(os.environ["CLONE_ATTR_SUBMIT_RETRIES"])
        retry_delay = int(os.environ["CLONE_ATTR_SUBMIT_RETRY_DELAY"])
        concurrency = int(os.environ["CLONE_ATTR_SUBMIT_CONCURRENCY"])
        progress_every = int(os.environ["CLONE_ATTR_SUBMIT_PROGRESS_EVERY"])
        targets = payload.get("cloned_disks_missing_attributes", []) or []

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def submit_one(target: dict) -> dict:
            vm_ext_id = target.get("vm_ext_id", "")
            disk_ext_id = target.get("disk_ext_id", "")
            custom_attributes = target.get("custom_attributes", []) or []
            if not vm_ext_id or not disk_ext_id:
                return {"vm_ext_id": vm_ext_id, "disk_ext_id": disk_ext_id, "success": False, "error": "missing vm_ext_id or disk_ext_id"}
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks/{disk_ext_id}/$actions/add-custom-attributes"
            body = {"customAttributes": custom_attributes}
            last_error = ""
            for _ in range(retries):
                try:
                    headers = {"NTNX-Request-Id": str(uuid.uuid4())}
                    response = session.post(url, headers=headers, json=body, timeout=(5, 30))
                    if response.status_code in (200, 201, 202):
                        task_ext_id = ((response.json().get("data", {}) or {}).get("extId", ""))
                        task_url = f"{base_url}/api/prism/v4.0/config/tasks/{task_ext_id}" if task_ext_id else ""
                        return {
                            "vm_ext_id": vm_ext_id,
                            "disk_ext_id": disk_ext_id,
                            "success": bool(task_ext_id),
                            "task_url": task_url,
                            "error": "" if task_ext_id else "attribute apply accepted but no task extId",
                        }
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return {"vm_ext_id": vm_ext_id, "disk_ext_id": disk_ext_id, "success": False, "error": last_error or "unknown error"}

        submitted = []
        failed = []
        processed = 0
        total = len(targets)
        print(f"PROGRESS stage=clone_attr_submit total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(submit_one, target) for target in targets]
            for future in concurrent.futures.as_completed(futures):
                result = future.result()
                processed += 1
                if result.get("success", False):
                    submitted.append(result)
                else:
                    failed.append(result)
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=clone_attr_submit processed={processed}/{total} success={len(submitted)} failed={len(failed)}",
                        flush=True,
                    )

        print(json.dumps({"submitted": submitted, "failed": failed}))
        PY
      register: clone_attr_submit_raw
