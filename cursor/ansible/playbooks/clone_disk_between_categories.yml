    - name: "Build list of cloned disk extIds from clone task results"
      ansible.builtin.set_fact:
        cloned_disks_created_by_task: "{{ cloned_disks_created_by_task + [created_item] }}"
      loop: "{{ (not ansible_check_mode) | ternary((clone_task_poll_results | default([])), []) }}"
      loop_control:
        label: "{{ item.vm_ext_id | default('unknown-vm') }}"
      vars:
        created_disk_ext_id: >-
          {{
            (
              item.task_data.entitiesAffected | default([]) |
              selectattr('rel', 'defined') |
              selectattr('rel', 'equalto', 'vmm:ahv:config:vm:disk') |
              map(attribute='extId') | list | first
            ) | default('')
          }}
        created_item:
          vm_ext_id: "{{ item.vm_ext_id }}"
          disk_ext_id: "{{ created_disk_ext_id }}"
      when:
        - not ansible_check_mode
        - created_disk_ext_id | length > 0

    - name: "Build list of cloned disks for optional post-clone custom-attribute sync"
