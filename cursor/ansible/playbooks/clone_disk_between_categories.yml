        payload_file = os.environ["CLONE_POLL_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["CLONE_POLL_BASE_URL"]
        username = os.environ["CLONE_POLL_USERNAME"]
        password = os.environ["CLONE_POLL_PASSWORD"]
        retries = int(os.environ["CLONE_POLL_RETRIES"])
        delay = int(os.environ["CLONE_POLL_DELAY"])
        concurrency = int(os.environ["CLONE_POLL_CONCURRENCY"])
        progress_every = int(os.environ["CLONE_POLL_PROGRESS_EVERY"])
        task_urls = payload.get("disk_clone_task_urls", {}) or {}

        terminal_success = {"SUCCEEDED", "COMPLETED", "COMPLETE"}
        terminal_failure = {"FAILED", "ERROR", "CANCELLED"}

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def poll_one(vm_ext_id: str, task_url: str) -> dict:
            full_url = task_url if task_url.startswith("http") else f"{base_url}{task_url}"
            last_status = "UNKNOWN"
            last_error = ""
            last_data = {}
            for _ in range(retries):
                try:
                    response = session.get(full_url, timeout=(5, 30))
                    if response.status_code == 200:
                        task_json = response.json()
                        data = task_json.get("data", {}) or {}
                        status = str(data.get("status", "UNKNOWN")).upper()
                        last_status = status
                        last_data = data
                        if status in terminal_success:
                            return {"vm_ext_id": vm_ext_id, "status": status, "success": True, "task_data": data, "error": ""}
                        if status in terminal_failure:
                            return {"vm_ext_id": vm_ext_id, "status": status, "success": False, "task_data": data, "error": f"terminal status {status}"}
                    else:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(delay)
            return {"vm_ext_id": vm_ext_id, "status": last_status, "success": False, "task_data": last_data, "error": last_error or "poll timeout"}

        results = []
        failed = []
        processed = 0
        total = len(task_urls)
        print(f"PROGRESS stage=clone_poll total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(poll_one, vm_ext_id, task_url) for vm_ext_id, task_url in task_urls.items()]
            for future in concurrent.futures.as_completed(futures):
                result = future.result()
                results.append(result)
                processed += 1
                if not result.get("success", False):
                    failed.append(result)
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=clone_poll processed={processed}/{total} success={processed - len(failed)} failed={len(failed)}",
                        flush=True,
                    )

        print(json.dumps({"results": results, "failed": failed}))
        PY
      register: clone_task_poll_raw
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - target_clone_apply | length > 0
        - (disk_clone_task_urls | default({}) | length) > 0
      check_mode: false
      environment:
        CLONE_POLL_PAYLOAD_FILE: "{{ clone_task_poll_payload_file.path }}"
        CLONE_POLL_BASE_URL: "{{ prism_base_url }}"
        CLONE_POLL_USERNAME: "{{ pc_username }}"
