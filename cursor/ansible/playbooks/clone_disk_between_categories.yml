        import json
        import os

        payload_file = os.environ["CLONE_IDEMPOTENCY_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        target_vms = payload.get("target_vms", [])
        target_vm_disks_by_vm = payload.get("target_vm_disks_by_vm", {})
        selected_source_vm_ext_id = payload.get("selected_source_vm_ext_id", "")
        selected_source_disk_ext_id = payload.get("selected_source_disk_ext_id", "")

        target_clone_apply = []
        target_clone_skipped = []

        for target_vm in target_vms:
            vm_ext_id = target_vm.get("extId", "")
            vm_name = target_vm.get("name", vm_ext_id)
            vm_disks = target_vm_disks_by_vm.get(vm_ext_id, []) or []

            equivalent_clone_exists = False
            for disk in vm_disks:
                backing_info = disk.get("backingInfo", {}) or {}
                data_source = backing_info.get("dataSource", {}) or {}
                reference = data_source.get("reference", {}) or {}
                vm_reference = reference.get("vmReference", {}) or {}
                ref_vm_ext_id = vm_reference.get("extId", "")
                ref_disk_ext_id = reference.get("diskExtId", "")
                if (
                    ref_vm_ext_id == selected_source_vm_ext_id
                    and ref_disk_ext_id == selected_source_disk_ext_id
                ):
                    equivalent_clone_exists = True
                    break

            if equivalent_clone_exists:
                target_clone_skipped.append(
                    {
                        "vm_ext_id": vm_ext_id,
                        "vm_name": vm_name,
                        "reason": "Equivalent clone from selected source disk already exists",
                    }
                )
            else:
                target_clone_apply.append(target_vm)

        print(
            json.dumps(
                {
                    "target_clone_apply": target_clone_apply,
                    "target_clone_skipped": target_clone_skipped,
                }
            )
        )
        PY
