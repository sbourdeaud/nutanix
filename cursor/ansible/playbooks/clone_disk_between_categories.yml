      loop: "{{ (not ansible_check_mode) | ternary((cloned_disks_created_by_task | default([])), []) }}"
      vars:
        vm_ext_id_for_disk: "{{ item.vm_ext_id }}"
        created_disk_ext_id: "{{ item.disk_ext_id }}"
        source_custom_attributes_effective: "{{ selected_source_disk.customAttributes | default([]) }}"
        apply_item:
