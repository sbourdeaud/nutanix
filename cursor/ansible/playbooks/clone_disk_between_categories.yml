    - name: "Clone selected source disk to eligible target VMs concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import uuid
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["CLONE_SUBMIT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["CLONE_SUBMIT_BASE_URL"]
        username = os.environ["CLONE_SUBMIT_USERNAME"]
        password = os.environ["CLONE_SUBMIT_PASSWORD"]
        retries = int(os.environ["CLONE_SUBMIT_RETRIES"])
        retry_delay = int(os.environ["CLONE_SUBMIT_RETRY_DELAY"])
        concurrency = int(os.environ["CLONE_SUBMIT_CONCURRENCY"])
        progress_every = int(os.environ["CLONE_SUBMIT_PROGRESS_EVERY"])

        targets = payload.get("target_clone_apply", [])
        vm_etag_by_vm = payload.get("vm_etag_by_vm", {})
        source_vm_ext_id = payload.get("selected_source_vm_ext_id", "")
        source_disk_ext_id = payload.get("selected_source_disk_ext_id", "")
        disk_size_bytes = int(payload.get("selected_source_disk_size_bytes", 0))
        disk_bus_type = payload.get("clone_disk_bus_type", "SCSI")
        container_ext_id = payload.get("clone_disk_storage_container_ext_id", "")
        source_custom_attributes = payload.get("clone_source_custom_attributes", []) or []
        flash_mode_enabled = bool(payload.get("clone_flash_mode_enabled", False))

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def submit_clone(target: dict) -> tuple[str, str, str]:
            vm_ext_id = target.get("extId", "")
            if not vm_ext_id:
                return "", "", "missing vm extId"

            clone_url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks"
            if_match = vm_etag_by_vm.get(vm_ext_id, "")
            request_id = str(uuid.uuid4())

            clone_payload = {
                "$objectType": "vmm.v4.ahv.config.Disk",
                "$backingInfoItemDiscriminator": "vmm.v4.ahv.config.VmDisk",
                "diskAddress": {
                    "$objectType": "vmm.v4.ahv.config.DiskAddress",
                    "busType": disk_bus_type,
                },
                "backingInfo": {
                    "$objectType": "vmm.v4.ahv.config.VmDisk",
                    "diskSizeBytes": disk_size_bytes,
                    "storageContainer": {
                        "$objectType": "vmm.v4.ahv.config.VmDiskContainerReference",
                        "extId": container_ext_id,
                    },
                    "storageConfig": {"isFlashModeEnabled": flash_mode_enabled},
                    "dataSource": {
                        "$objectType": "vmm.v4.ahv.config.DataSource",
                        "reference": {
                            "$objectType": "vmm.v4.ahv.config.VmDiskReference",
                            "diskExtId": source_disk_ext_id,
                            "vmReference": {
                                "$objectType": "vmm.v4.ahv.config.VmReference",
                                "extId": source_vm_ext_id,
                            },
                        },
                    },
                },
            }
            if source_custom_attributes:
                clone_payload["customAttributes"] = source_custom_attributes

            headers = {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "NTNX-Request-Id": request_id,
            }
            if if_match:
                headers["If-Match"] = if_match

            last_error = ""
            for _ in range(retries):
                try:
                    response = session.post(clone_url, headers=headers, json=clone_payload, timeout=(5, 30))
                    if response.status_code in (200, 201, 202):
                        task_ext_id = (response.json().get("data", {}) or {}).get("extId", "")
                        if task_ext_id:
                            return vm_ext_id, f"{base_url}/api/prism/v4.0/config/tasks/{task_ext_id}", ""
                        last_error = "clone accepted but no task extId returned"
                    else:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return vm_ext_id, "", last_error or "unknown error"

        task_urls = {}
        failed = []
        submitted_vm_ext_ids = []
        processed = 0
        total = len(targets)
        print(f"PROGRESS stage=clone_submit total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as executor:
            futures = [executor.submit(submit_clone, target) for target in targets]
            for future in concurrent.futures.as_completed(futures):
                vm_ext_id, task_url, err = future.result()
                processed += 1
                if err:
                    failed.append({"vm_ext_id": vm_ext_id, "error": err})
                else:
                    task_urls[vm_ext_id] = task_url
                    submitted_vm_ext_ids.append(vm_ext_id)
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=clone_submit processed={processed}/{total} success={len(submitted_vm_ext_ids)} failed={len(failed)}",
                        flush=True,
                    )

        print(
            json.dumps(
                {
                    "disk_clone_task_urls": task_urls,
                    "submitted_vm_ext_ids": submitted_vm_ext_ids,
                    "failed": failed,
                }
            )
        )
        if failed:
            sys.exit(1)
        PY
      register: clone_submit_raw
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - target_clone_apply | length > 0
      check_mode: false
      environment:
        CLONE_SUBMIT_PAYLOAD_FILE: "{{ clone_submit_payload_file.path }}"
        CLONE_SUBMIT_BASE_URL: "{{ prism_base_url }}"
        CLONE_SUBMIT_USERNAME: "{{ pc_username }}"
