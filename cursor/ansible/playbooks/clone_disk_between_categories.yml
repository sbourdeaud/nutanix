---
- name: "Clone VM disk between categories"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/disk_clone_defaults.yml"
  vars:
    ansible_python_interpreter: "{{ (playbook_dir | dirname) + '/.venv/bin/python' }}"
    prism_base_url: "https://{{ pc_ip }}:9440"
    vm_list_endpoint: "/api/vmm/v4.0/ahv/config/vms"
    category_list_endpoint: "/api/prism/v4.0/config/categories"
    vm_disk_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s/disks"
    vm_disk_add_custom_attributes_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s/disks/%s/$actions/add-custom-attributes"
    vm_get_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s"
    request_headers:
      Content-Type: "application/json"
      Accept: "application/json"
      Cache-Control: "no-cache"
  tasks:
    - name: "Validate required inputs"
      ansible.builtin.assert:
        that:
          - pc_ip is defined and pc_ip | length > 0
          - pc_username is defined and pc_username | length > 0
          - pc_password is defined and pc_password | length > 0
          - source_category_key is defined and source_category_key | length > 0
          - source_category_value is defined and source_category_value | length > 0
          - target_category_key is defined and target_category_key | length > 0
          - target_category_value is defined and target_category_value | length > 0
          - source_disk_custom_attribute is defined and source_disk_custom_attribute | length > 0
        fail_msg: >-
          Missing required variables. Required: pc_ip, pc_username, pc_password,
          source_category_key, source_category_value, target_category_key,
          target_category_value, source_disk_custom_attribute.
      check_mode: false

    - name: "Resolve source category extId"
      ansible.builtin.uri:
        url: "{{ prism_base_url }}{{ category_list_endpoint }}?$filter={{ category_filter | urlencode }}&$page=0&$limit=50"
        method: GET
        url_username: "{{ pc_username }}"
        url_password: "{{ pc_password }}"
        force_basic_auth: true
        headers: "{{ request_headers }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: source_category_lookup
      delegate_to: localhost
      check_mode: false
      no_log: true
      vars:
        category_filter: "key eq '{{ source_category_key | replace(\"'\", \"''\") }}' and value eq '{{ source_category_value | replace(\"'\", \"''\") }}'"

    - name: "Resolve target category extId"
      ansible.builtin.uri:
        url: "{{ prism_base_url }}{{ category_list_endpoint }}?$filter={{ category_filter | urlencode }}&$page=0&$limit=50"
        method: GET
        url_username: "{{ pc_username }}"
        url_password: "{{ pc_password }}"
        force_basic_auth: true
        headers: "{{ request_headers }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: target_category_lookup
      delegate_to: localhost
      check_mode: false
      no_log: true
      vars:
        category_filter: "key eq '{{ target_category_key | replace(\"'\", \"''\") }}' and value eq '{{ target_category_value | replace(\"'\", \"''\") }}'"

    - name: "Fail when source category is not unique"
      ansible.builtin.fail:
        msg: "Source category '{{ source_category_key }}:{{ source_category_value }}' must resolve to exactly one category. Found: {{ source_category_lookup.json.data | default([]) | length }}"
      when: source_category_lookup.json.data | default([]) | length != 1

    - name: "Fail when target category is not unique"
      ansible.builtin.fail:
        msg: "Target category '{{ target_category_key }}:{{ target_category_value }}' must resolve to exactly one category. Found: {{ target_category_lookup.json.data | default([]) | length }}"
      when: target_category_lookup.json.data | default([]) | length != 1

    - name: "Set resolved category extIds"
      ansible.builtin.set_fact:
        source_category_ext_id: "{{ source_category_lookup.json.data[0].extId }}"
        target_category_ext_id: "{{ target_category_lookup.json.data[0].extId }}"

    - name: "Fetch first page of VMs with retry backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])

        url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page=0&$limit={page_limit}"
        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        last_error = ""
        for attempt in range(retries):
            try:
                response = requests.get(
                    url,
                    auth=(username, password),
                    headers=headers,
                    verify=False,
                    timeout=(5, timeout_seconds),
                )
                if response.status_code == 200:
                    print(response.text)
                    sys.exit(0)
                last_error = f"HTTP {response.status_code}: {response.text}"
            except Exception as exc:
                last_error = str(exc)
            time.sleep(backoff * (2 ** attempt))

        print(json.dumps({"error": last_error}))
        sys.exit(1)
        PY
      register: vm_page_0_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"

    - name: "Parse first page VM response"
      ansible.builtin.set_fact:
        vm_page_0_json: "{{ vm_page_0_raw.stdout | from_json }}"

    - name: "Initialize VM pagination facts"
      ansible.builtin.set_fact:
        total_available_vms: "{{ vm_page_0_json.metadata.totalAvailableResults | default(vm_page_0_json.data | default([]) | length) | int }}"
        all_vms: "{{ vm_page_0_json.data | default([]) }}"

    - name: "Compute VM total page count"
      ansible.builtin.set_fact:
        total_vm_pages: "{{ ((total_available_vms | int) + (api_page_limit | int) - 1) // (api_page_limit | int) }}"

    - name: "Fetch remaining VM pages concurrently with backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        total_pages = int(os.environ["TOTAL_PAGES"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])
        concurrency = int(os.environ["PAGE_FETCH_CONCURRENCY"])

        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        def fetch_page(page_num: int):
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page={page_num}&$limit={page_limit}"
            last_error = ""
            for attempt in range(retries):
                try:
                    response = requests.get(
                        url,
                        auth=(username, password),
                        headers=headers,
                        verify=False,
                        timeout=(5, timeout_seconds),
                    )
                    if response.status_code == 200:
                        payload = response.json()
                        return {"page": page_num, "data": payload.get("data", [])}
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(backoff * (2 ** attempt))
            return {"page": page_num, "error": last_error or "unknown error"}

        pages = []
        failed = []
        if total_pages > 1:
            page_numbers = list(range(1, total_pages))
            with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as executor:
                futures = [executor.submit(fetch_page, p) for p in page_numbers]
                for future in concurrent.futures.as_completed(futures):
                    result = future.result()
                    if "error" in result:
                        failed.append(result)
                    else:
                        pages.append(result)

        pages.sort(key=lambda item: item["page"])
        print(json.dumps({"pages": pages, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: vm_other_pages_raw
      delegate_to: localhost
      when: total_vm_pages | int > 1
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        TOTAL_PAGES: "{{ total_vm_pages | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"
        PAGE_FETCH_CONCURRENCY: "{{ vm_page_fetch_concurrency | int }}"

    - name: "Parse remaining VM pages response"
      ansible.builtin.set_fact:
        vm_other_pages_json: "{{ vm_other_pages_raw.stdout | from_json }}"
      when: total_vm_pages | int > 1

    - name: "Merge paginated VM results"
      ansible.builtin.set_fact:
        all_vms: "{{ all_vms + (vm_other_pages_json.pages | default([]) | map(attribute='data') | list | flatten) }}"
      when: total_vm_pages | int > 1

    - name: "Create temporary file for source/target VM filtering input"
      ansible.builtin.tempfile:
        state: file
        suffix: "_clone_vm_filtering_input.json"
      register: clone_vm_filtering_input_file
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Write source/target VM filtering payload"
      ansible.builtin.copy:
        dest: "{{ clone_vm_filtering_input_file.path }}"
        mode: "0600"
        content: >-
          {{
            {
              'all_vms': (all_vms | default([])),
              'source_category_ext_id': source_category_ext_id,
              'target_category_ext_id': target_category_ext_id
            } | to_json
          }}
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Build source and target category VM lists in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["CLONE_VM_FILTER_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        all_vms = payload.get("all_vms", [])
        source_category_ext_id = payload.get("source_category_ext_id", "")
        target_category_ext_id = payload.get("target_category_ext_id", "")

        source_vms = []
        target_vms = []

        for vm in all_vms:
            categories = vm.get("categories", []) or []
            vm_category_ext_ids = [cat.get("extId", "") for cat in categories if isinstance(cat, dict)]
            if source_category_ext_id and source_category_ext_id in vm_category_ext_ids:
                source_vms.append(vm)
            if target_category_ext_id and target_category_ext_id in vm_category_ext_ids:
                target_vms.append(vm)

        print(json.dumps({"source_vms": source_vms, "target_vms": target_vms}))
        PY
      register: clone_vm_filtering_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        CLONE_VM_FILTER_PAYLOAD_FILE: "{{ clone_vm_filtering_input_file.path }}"

    - name: "Parse source/target VM filtering output"
      ansible.builtin.set_fact:
        clone_vm_filtering_json: "{{ clone_vm_filtering_raw.stdout | from_json }}"

    - name: "Set source and target VM lists"
      ansible.builtin.set_fact:
        source_vms: "{{ clone_vm_filtering_json.source_vms | default([]) }}"
        target_vms: "{{ clone_vm_filtering_json.target_vms | default([]) }}"

    - name: "Remove temporary source/target VM filtering file"
      ansible.builtin.file:
        path: "{{ clone_vm_filtering_input_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Fail when no source VMs match"
      ansible.builtin.fail:
        msg: "No source VMs matched category {{ source_category_key }}:{{ source_category_value }}."
      when: source_vms | default([]) | length == 0

    - name: "Fail when no target VMs match"
      ansible.builtin.fail:
        msg: "No target VMs matched category {{ target_category_key }}:{{ target_category_value }}."
      when: target_vms | default([]) | length == 0

    - name: "Auto-select source VM when exactly one match exists"
      ansible.builtin.set_fact:
        selected_source_vm_ext_id: "{{ (source_vms | first).extId }}"
      when:
        - source_vm_ext_id | default('') | length == 0
        - source_vms | length == 1

    - name: "Show source VM selection menu"
      ansible.builtin.debug:
        msg: "{{ vm_idx + 1 }}. {{ vm_item.name | default(vm_item.extId) }} ({{ vm_item.extId }})"
      loop: "{{ source_vms }}"
      loop_control:
        loop_var: vm_item
        index_var: vm_idx
      when:
        - source_vm_ext_id | default('') | length == 0
        - source_vms | length > 1

    - name: "Prompt for source VM selection"
      ansible.builtin.pause:
        prompt: "Enter source VM selection number (1-{{ source_vms | length }}):"
      register: source_vm_selection_input
      when:
        - source_vm_ext_id | default('') | length == 0
        - source_vms | length > 1

    - name: "Validate source VM selection input"
      ansible.builtin.assert:
        that:
          - source_vm_selection_input.user_input is match('^[0-9]+$')
          - (source_vm_selection_input.user_input | int) >= 1
          - (source_vm_selection_input.user_input | int) <= (source_vms | length)
        fail_msg: "Invalid source VM selection number."
      when:
        - source_vm_ext_id | default('') | length == 0
        - source_vms | length > 1

    - name: "Set selected source VM from prompt"
      ansible.builtin.set_fact:
        selected_source_vm_ext_id: "{{ source_vms[(source_vm_selection_input.user_input | int) - 1].extId }}"
      when:
        - source_vm_ext_id | default('') | length == 0
        - source_vms | length > 1

    - name: "Set selected source VM from explicit input"
      ansible.builtin.set_fact:
        selected_source_vm_ext_id: "{{ source_vm_ext_id }}"
      when: source_vm_ext_id | default('') | length > 0

    - name: "Fail when explicit source VM is not in source category"
      ansible.builtin.fail:
        msg: "source_vm_ext_id '{{ selected_source_vm_ext_id }}' is not present in source category results."
      when:
        - selected_source_vm_ext_id is defined
        - (source_vms | selectattr('extId', 'equalto', selected_source_vm_ext_id) | list | length) == 0

    - name: "Set selected source VM object"
      ansible.builtin.set_fact:
        selected_source_vm: "{{ (source_vms | selectattr('extId', 'equalto', selected_source_vm_ext_id) | list | first) }}"

    - name: "Fetch disks for selected source VM"
      ansible.builtin.uri:
        url: "{{ prism_base_url }}{{ vm_disk_endpoint_template | format(selected_source_vm_ext_id) }}?$page=0&$limit=100"
        method: GET
        url_username: "{{ pc_username }}"
        url_password: "{{ pc_password }}"
        force_basic_auth: true
        headers: "{{ request_headers }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: source_vm_disk_inventory
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Filter source VM disks by custom attribute"
      ansible.builtin.set_fact:
        source_matching_disks: "{{ source_matching_disks | default([]) + [disk_item] }}"
      loop: "{{ source_vm_disk_inventory.json.data | default([]) }}"
      loop_control:
        loop_var: disk_item
      when:
        - disk_item.customAttributes is defined
        - source_disk_custom_attribute in (disk_item.customAttributes | default([]))

    - name: "Fail when no source disks match custom attribute"
      ansible.builtin.fail:
        msg: >-
          No disks on source VM {{ selected_source_vm.name | default(selected_source_vm.extId) }}
          matched custom attribute '{{ source_disk_custom_attribute }}'.
      when: source_matching_disks | default([]) | length == 0

    - name: "Auto-select source disk when exactly one match exists"
      ansible.builtin.set_fact:
        selected_source_disk_ext_id: "{{ (source_matching_disks | first).extId }}"
      when:
        - source_disk_ext_id | default('') | length == 0
        - source_matching_disks | length == 1

    - name: "Show source disk selection menu"
      ansible.builtin.debug:
        msg: >-
          {{ disk_idx + 1 }}. {{ disk_item.extId }} ({{ disk_item.diskAddress.busType | default('UNKNOWN') }}.{{ disk_item.diskAddress.index | default('?') }},
          {{ ((disk_item.backingInfo.diskSizeBytes | default(0) | float) / 1073741824) | round(2) }} GiB)
      loop: "{{ source_matching_disks }}"
      loop_control:
        loop_var: disk_item
        index_var: disk_idx
      when:
        - source_disk_ext_id | default('') | length == 0
        - source_matching_disks | length > 1

    - name: "Prompt for source disk selection"
      ansible.builtin.pause:
        prompt: "Enter source disk selection number (1-{{ source_matching_disks | length }}):"
      register: source_disk_selection_input
      when:
        - source_disk_ext_id | default('') | length == 0
        - source_matching_disks | length > 1

    - name: "Validate source disk selection input"
      ansible.builtin.assert:
        that:
          - source_disk_selection_input.user_input is match('^[0-9]+$')
          - (source_disk_selection_input.user_input | int) >= 1
          - (source_disk_selection_input.user_input | int) <= (source_matching_disks | length)
        fail_msg: "Invalid source disk selection number."
      when:
        - source_disk_ext_id | default('') | length == 0
        - source_matching_disks | length > 1

    - name: "Set selected source disk from prompt"
      ansible.builtin.set_fact:
        selected_source_disk_ext_id: "{{ source_matching_disks[(source_disk_selection_input.user_input | int) - 1].extId }}"
      when:
        - source_disk_ext_id | default('') | length == 0
        - source_matching_disks | length > 1

    - name: "Set selected source disk from explicit input"
      ansible.builtin.set_fact:
        selected_source_disk_ext_id: "{{ source_disk_ext_id }}"
      when: source_disk_ext_id | default('') | length > 0

    - name: "Fail when explicit source disk is not in matching set"
      ansible.builtin.fail:
        msg: "source_disk_ext_id '{{ selected_source_disk_ext_id }}' is not in source VM disks filtered by '{{ source_disk_custom_attribute }}'."
      when:
        - selected_source_disk_ext_id is defined
        - (source_matching_disks | selectattr('extId', 'equalto', selected_source_disk_ext_id) | list | length) == 0

    - name: "Set selected source disk object"
      ansible.builtin.set_fact:
        selected_source_disk: "{{ (source_matching_disks | selectattr('extId', 'equalto', selected_source_disk_ext_id) | list | first) }}"

    - name: "Validate clone storage container resolution"
      ansible.builtin.assert:
        that:
          - (clone_disk_storage_container_ext_id | default('') | length > 0) or (selected_source_disk.backingInfo.storageContainer.extId | default('') | length > 0)
        fail_msg: >-
          No storage container available for clone. Set clone_disk_storage_container_ext_id
          or ensure the selected source disk has backingInfo.storageContainer.extId.

    - name: "Create temporary file for target disk inventory payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_clone_target_disk_inventory_payload.json"
      register: target_disk_inventory_payload_file
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Write target disk inventory payload"
      ansible.builtin.copy:
        dest: "{{ target_disk_inventory_payload_file.path }}"
        mode: "0600"
        content: "{{ {'target_vms': (target_vms | default([]))} | to_json }}"
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Build target embedded disk map and fallback VM list in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["TARGET_DISK_INVENTORY_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        target_vms = payload.get("target_vms", [])
        embedded_disks_by_vm = {}
        fallback_vm_ext_ids = []

        for vm in target_vms:
            vm_ext_id = vm.get("extId", "")
            if not vm_ext_id:
                continue
            vm_disks = vm.get("disks", [])
            if isinstance(vm_disks, list) and len(vm_disks) > 0:
                embedded_disks_by_vm[vm_ext_id] = vm_disks
            else:
                fallback_vm_ext_ids.append(vm_ext_id)

        print(
            json.dumps(
                {
                    "embedded_disks_by_vm": embedded_disks_by_vm,
                    "fallback_vm_ext_ids": fallback_vm_ext_ids,
                }
            )
        )
        PY
      register: target_disk_inventory_build_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        TARGET_DISK_INVENTORY_PAYLOAD_FILE: "{{ target_disk_inventory_payload_file.path }}"

    - name: "Set target embedded/fallback disk inventory facts"
      ansible.builtin.set_fact:
        target_embedded_disks_by_vm: "{{ (target_disk_inventory_build_raw.stdout | from_json).embedded_disks_by_vm | default({}) }}"
        target_fallback_vm_ext_ids: "{{ (target_disk_inventory_build_raw.stdout | from_json).fallback_vm_ext_ids | default([]) }}"

    - name: "Remove temporary target disk inventory payload file"
      ansible.builtin.file:
        path: "{{ target_disk_inventory_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Fetch target fallback disks concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["FALLBACK_BASE_URL"]
        username = os.environ["FALLBACK_USERNAME"]
        password = os.environ["FALLBACK_PASSWORD"]
        vm_ids = json.loads(os.environ["FALLBACK_VM_IDS"])
        retries = int(os.environ["FALLBACK_RETRIES"])
        retry_delay = int(os.environ["FALLBACK_RETRY_DELAY"])
        max_workers = int(os.environ["FALLBACK_CONCURRENCY"])
        progress_every = int(os.environ["FALLBACK_PROGRESS_EVERY"])

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_disks(vm_ext_id: str) -> tuple[str, list, str]:
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks?$page=0&$limit=100"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        payload = response.json()
                        return vm_ext_id, payload.get("data", []), ""
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                import time
                time.sleep(retry_delay)
            return vm_ext_id, [], last_error or "unknown error"

        success = {}
        failed = []
        processed = 0
        total = len(vm_ids)
        print(f"PROGRESS stage=clone_target_fallback_fetch total={total}", flush=True)
        if vm_ids:
            with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as executor:
                futures = [executor.submit(fetch_disks, vm_id) for vm_id in vm_ids]
                for future in concurrent.futures.as_completed(futures):
                    vm_id, disks, err = future.result()
                    processed += 1
                    if err:
                        failed.append({"vm_ext_id": vm_id, "error": err})
                    else:
                        success[vm_id] = disks
                    if (processed % progress_every == 0) or (processed == total):
                        print(
                            f"PROGRESS stage=clone_target_fallback_fetch processed={processed}/{total} success={len(success)} failed={len(failed)}",
                            flush=True,
                        )

        print(json.dumps({"success": success, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
