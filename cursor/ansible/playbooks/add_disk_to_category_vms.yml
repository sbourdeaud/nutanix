---
- name: "Attach vDisk to VMs by category"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/disk_attach_defaults.yml"
  vars:
    ansible_python_interpreter: "{{ (playbook_dir | dirname) + '/.venv/bin/python' }}"
    prism_base_url: "https://{{ pc_ip }}:9440"
    vm_list_endpoint: "/api/vmm/v4.0/ahv/config/vms"
    category_list_endpoint: "/api/prism/v4.0/config/categories"
    vm_disk_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s/disks"
    vm_get_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s"
    storage_container_list_endpoint: "/api/vmm/v4.0/ahv/config/storage-containers"
    request_headers:
      Content-Type: "application/json"
      Accept: "application/json"
      Cache-Control: "no-cache"
  tasks:
    - name: "Validate required inputs"
      ansible.builtin.assert:
        that:
          - pc_ip is defined and pc_ip | length > 0
          - pc_username is defined and pc_username | length > 0
          - pc_password is defined and pc_password | length > 0
          - category_key is defined and category_key | length > 0
          - category_value is defined and category_value | length > 0
        fail_msg: >-
          Missing required variables. Required: pc_ip, pc_username, pc_password,
          category_key, category_value.
      check_mode: false

    - name: "Validate storage-container resolution settings"
      ansible.builtin.assert:
        that:
          - (storage_container_ext_id | default('') | length > 0) or (storage_container_name | default('') | length > 0) or (use_vm_scsi0_container | bool)
        fail_msg: >-
          No storage container resolution path available. Set storage_container_ext_id,
          or storage_container_name, or enable use_vm_scsi0_container=true.
      check_mode: false

    - name: "Normalize custom attributes input to list"
      ansible.builtin.set_fact:
        custom_attributes_effective: >-
          {{
            (
              custom_attributes
              if (custom_attributes is sequence and custom_attributes is not string)
              else
              (
                (custom_attributes | from_yaml)
                if (custom_attributes is string)
                else []
              )
            )
            if (
              (
                custom_attributes is sequence and custom_attributes is not string
              )
              or
              (
                (custom_attributes is string) and
                ((custom_attributes | from_yaml) is sequence) and
                ((custom_attributes | from_yaml) is not string)
              )
            )
            else
            (
              [custom_attributes]
              if (custom_attributes is string and custom_attributes | length > 0)
              else []
            )
          }}

    - name: "Resolve category extId"
      ansible.builtin.uri:
        url: "{{ prism_base_url }}{{ category_list_endpoint }}?$filter={{ category_filter | urlencode }}&$page=0&$limit=50"
        method: GET
        url_username: "{{ pc_username }}"
        url_password: "{{ pc_password }}"
        force_basic_auth: true
        headers: "{{ request_headers }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: category_lookup
      delegate_to: localhost
      check_mode: false
      no_log: true
      vars:
        category_filter: "key eq '{{ category_key | replace(\"'\", \"''\") }}' and value eq '{{ category_value | replace(\"'\", \"''\") }}'"

    - name: "Fail when category is not unique"
      ansible.builtin.fail:
        msg: "Category '{{ category_key }}:{{ category_value }}' must resolve to exactly one category. Found: {{ category_lookup.json.data | default([]) | length }}"
      when: category_lookup.json.data | default([]) | length != 1

    - name: "Set resolved category extId"
      ansible.builtin.set_fact:
        category_ext_id: "{{ category_lookup.json.data[0].extId }}"

    - name: "Fetch first page of VMs with retry backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])

        url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page=0&$limit={page_limit}"
        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        last_error = ""
        for attempt in range(retries):
            try:
                response = requests.get(
                    url,
                    auth=(username, password),
                    headers=headers,
                    verify=False,
                    timeout=(5, timeout_seconds),
                )
                if response.status_code == 200:
                    print(response.text)
                    sys.exit(0)
                last_error = f"HTTP {response.status_code}: {response.text}"
            except Exception as exc:
                last_error = str(exc)
            time.sleep(backoff * (2 ** attempt))

        print(json.dumps({"error": last_error}))
        sys.exit(1)
        PY
      register: vm_page_0_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"

    - name: "Parse first page VM response"
      ansible.builtin.set_fact:
        vm_page_0_json: "{{ vm_page_0_raw.stdout | from_json }}"

    - name: "Initialize base VM pagination facts"
      ansible.builtin.set_fact:
        total_available_vms: "{{ vm_page_0_json.metadata.totalAvailableResults | default(vm_page_0_json.data | default([]) | length) | int }}"
        all_vms: "{{ vm_page_0_json.data | default([]) }}"

    - name: "Compute VM total page count"
      ansible.builtin.set_fact:
        total_vm_pages: "{{ ((total_available_vms | int) + (api_page_limit | int) - 1) // (api_page_limit | int) }}"

    - name: "Fetch remaining VM pages concurrently with backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        total_pages = int(os.environ["TOTAL_PAGES"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])
        concurrency = int(os.environ["PAGE_FETCH_CONCURRENCY"])

        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        def fetch_page(page_num: int):
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page={page_num}&$limit={page_limit}"
            last_error = ""
            for attempt in range(retries):
                try:
                    response = requests.get(
                        url,
                        auth=(username, password),
                        headers=headers,
                        verify=False,
                        timeout=(5, timeout_seconds),
                    )
                    if response.status_code == 200:
                        payload = response.json()
                        return {"page": page_num, "data": payload.get("data", [])}
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(backoff * (2 ** attempt))
            return {"page": page_num, "error": last_error or "unknown error"}

        pages = []
        failed = []
        if total_pages > 1:
            page_numbers = list(range(1, total_pages))
            with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as executor:
                futures = [executor.submit(fetch_page, p) for p in page_numbers]
                for future in concurrent.futures.as_completed(futures):
                    result = future.result()
                    if "error" in result:
                        failed.append(result)
                    else:
                        pages.append(result)

        pages.sort(key=lambda item: item["page"])
        print(json.dumps({"pages": pages, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: vm_other_pages_raw
      delegate_to: localhost
      when: total_vm_pages | int > 1
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        TOTAL_PAGES: "{{ total_vm_pages | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"
        PAGE_FETCH_CONCURRENCY: "{{ vm_page_fetch_concurrency | int }}"

    - name: "Parse remaining VM pages response"
      ansible.builtin.set_fact:
        vm_other_pages_json: "{{ vm_other_pages_raw.stdout | from_json }}"
      when: total_vm_pages | int > 1

    - name: "Merge paginated VM results"
      ansible.builtin.set_fact:
        all_vms: "{{ all_vms + (vm_other_pages_json.pages | default([]) | map(attribute='data') | list | flatten) }}"
      when: total_vm_pages | int > 1

    - name: "Create temporary file for VM filtering input"
      ansible.builtin.tempfile:
        state: file
        suffix: "_vm_filtering_input.json"
      register: vm_filtering_input_file
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Write VM filtering input payload"
      ansible.builtin.copy:
        dest: "{{ vm_filtering_input_file.path }}"
        mode: "0600"
        content: "{{ {'all_vms': all_vms | default([]), 'category_ext_id': category_ext_id} | to_json }}"
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Filter category-matched VMs in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["VM_FILTER_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        all_vms = payload.get("all_vms", [])
        category_ext_id = payload.get("category_ext_id", "")
        matched_vms = []
        matched_vm_ext_ids = []

        for vm in all_vms:
            vm_ext_id = vm.get("extId", "")
            if not vm_ext_id:
                continue
            categories = vm.get("categories", []) or []
            vm_category_ext_ids = [cat.get("extId", "") for cat in categories if isinstance(cat, dict)]
            if category_ext_id in vm_category_ext_ids:
                matched_vms.append(vm)
                matched_vm_ext_ids.append(vm_ext_id)

        print(json.dumps({"matched_vms": matched_vms, "matched_vm_ext_ids": matched_vm_ext_ids}))
        PY
      register: vm_filtering_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        VM_FILTER_PAYLOAD_FILE: "{{ vm_filtering_input_file.path }}"

    - name: "Parse VM filtering output"
      ansible.builtin.set_fact:
        vm_filtering_json: "{{ vm_filtering_raw.stdout | from_json }}"

    - name: "Set matched VMs and extIds"
      ansible.builtin.set_fact:
        matched_vms: "{{ vm_filtering_json.matched_vms | default([]) }}"
        matched_vm_ext_ids: "{{ vm_filtering_json.matched_vm_ext_ids | default([]) }}"

    - name: "Remove temporary VM filtering input file"
      ansible.builtin.file:
        path: "{{ vm_filtering_input_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Report no-op when no VM matches category"
      ansible.builtin.debug:
        msg: "No VMs matched category {{ category_key }}:{{ category_value }}. Nothing to do."
      when: matched_vm_ext_ids | length == 0

    - name: "Initialize hybrid disk inventory maps"
      ansible.builtin.set_fact:
        embedded_disks_by_vm: {}
        fallback_vm_ext_ids: []
      when: matched_vm_ext_ids | length > 0

    - name: "Build embedded disk map and fallback VM list"
      ansible.builtin.set_fact:
        embedded_disks_by_vm: "{{ embedded_disks_by_vm | combine({vm_item.extId: (vm_item.disks | default([]))}) if has_embedded_disks else embedded_disks_by_vm }}"
        fallback_vm_ext_ids: "{{ fallback_vm_ext_ids + ([vm_item.extId] if not has_embedded_disks else []) }}"
      loop: "{{ matched_vms | default([]) }}"
      loop_control:
        loop_var: vm_item
        label: "{{ vm_item.name | default(vm_item.extId | default('unknown-vm')) }}"
      vars:
        has_embedded_disks: "{{ (vm_item.disks is defined) and ((vm_item.disks | length) > 0) }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Fetch fallback disks concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["FALLBACK_BASE_URL"]
        username = os.environ["FALLBACK_USERNAME"]
        password = os.environ["FALLBACK_PASSWORD"]
        vm_ids = json.loads(os.environ["FALLBACK_VM_IDS"])
        retries = int(os.environ["FALLBACK_RETRIES"])
        retry_delay = int(os.environ["FALLBACK_RETRY_DELAY"])
        max_workers = int(os.environ["FALLBACK_CONCURRENCY"])
        progress_every = int(os.environ["FALLBACK_PROGRESS_EVERY"])

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_disks(vm_ext_id: str) -> tuple[str, list, str]:
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks?$page=0&$limit=100"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        payload = response.json()
                        return vm_ext_id, payload.get("data", []), ""
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                import time
                time.sleep(retry_delay)
            return vm_ext_id, [], last_error or "unknown error"

        success = {}
        failed = []
        processed = 0
        total = len(vm_ids)
        print(f"PROGRESS stage=fallback_disk_fetch total={total}", flush=True)
        if vm_ids:
            with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as executor:
                futures = [executor.submit(fetch_disks, vm_id) for vm_id in vm_ids]
                for future in concurrent.futures.as_completed(futures):
                    vm_id, disks, err = future.result()
                    processed += 1
                    if err:
                        failed.append({"vm_ext_id": vm_id, "error": err})
                    else:
                        success[vm_id] = disks
                    if (processed % progress_every == 0) or (processed == total):
                        print(
                            f"PROGRESS stage=fallback_disk_fetch processed={processed}/{total} success={len(success)} failed={len(failed)}",
                            flush=True,
                        )

        print(json.dumps({"success": success, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: fallback_disk_fetch_raw
      delegate_to: localhost
      check_mode: false
      when: fallback_vm_ext_ids | default([]) | length > 0
      environment:
        FALLBACK_BASE_URL: "{{ prism_base_url }}"
        FALLBACK_USERNAME: "{{ pc_username }}"
        FALLBACK_PASSWORD: "{{ pc_password }}"
        FALLBACK_VM_IDS: "{{ fallback_vm_ext_ids | default([]) | to_json }}"
        FALLBACK_RETRIES: "{{ api_retries | int }}"
        FALLBACK_RETRY_DELAY: "{{ api_retry_delay_seconds | int }}"
        FALLBACK_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        FALLBACK_PROGRESS_EVERY: "{{ operation_progress_every | int }}"

    - name: "Parse fallback disk fetch result"
      ansible.builtin.set_fact:
        fallback_disk_fetch_json: "{{ (fallback_disk_fetch_raw.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json }}"
      when: fallback_vm_ext_ids | default([]) | length > 0

    - name: "Initialize empty fallback disk map when not needed"
      ansible.builtin.set_fact:
        fallback_disks_by_vm: {}
      when: fallback_vm_ext_ids | default([]) | length == 0

    - name: "Set fallback disk map from fetch result"
      ansible.builtin.set_fact:
        fallback_disks_by_vm: "{{ fallback_disk_fetch_json.success | default({}) }}"
      when: fallback_vm_ext_ids | default([]) | length > 0

    - name: "Merge embedded and fallback disk maps"
      ansible.builtin.set_fact:
        vm_disks_by_vm: "{{ embedded_disks_by_vm | combine(fallback_disks_by_vm) }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Initialize decision lists"
      ansible.builtin.set_fact:
        vm_attach_candidates: []
        vm_attach_final: []
        vm_attach_skipped: []
        vm_skipped_reasons: []

    - name: "Build per-VM disk and cluster context"
      ansible.builtin.set_fact:
        vm_resolution_contexts: "{{ vm_resolution_contexts | default([]) + [vm_context] }}"
      loop: "{{ matched_vms | default([]) }}"
      loop_control:
        loop_var: vm_obj
        label: "{{ vm_obj.name | default(vm_obj.extId | default('unknown-vm')) }}"
      vars:
        vm_cluster_ext_id_value: >-
          {{
            vm_obj.cluster.extId
            | default(vm_obj.clusterReference.extId
            | default(vm_obj.clusterExtId | default('')))
          }}
        vm_scsi0_container_ext_id_value: >-
          {{
            (vm_disks_by_vm[vm_obj.extId] | default([])) |
            selectattr('diskAddress.busType', 'defined') |
            selectattr('diskAddress.busType', 'equalto', 'SCSI') |
            selectattr('diskAddress.index', 'defined') |
            selectattr('diskAddress.index', 'equalto', 0) |
            selectattr('backingInfo.storageContainer.extId', 'defined') |
            map(attribute='backingInfo.storageContainer.extId') |
            list | first | default('')
          }}
        vm_context:
          vm_ext_id: "{{ vm_obj.extId }}"
          vm_name: "{{ vm_obj.name | default(vm_obj.extId) }}"
          vm_cluster_ext_id: "{{ vm_cluster_ext_id_value }}"
          vm_scsi0_container_ext_id: "{{ vm_scsi0_container_ext_id_value }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Initialize per-VM name-resolution maps"
      ansible.builtin.set_fact:
        vm_named_container_by_vm: {}
        vm_name_resolution_error_by_vm: {}

    - name: "Create temporary file for container-name lookup payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_container_lookup_payload.json"
      register: container_lookup_payload_file
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - storage_container_ext_id | default('') | length == 0
        - storage_container_name | default('') | length > 0

    - name: "Write container-name lookup payload"
      ansible.builtin.copy:
        dest: "{{ container_lookup_payload_file.path }}"
        mode: "0600"
        content: >-
          {{
            {
              'vm_resolution_contexts': (vm_resolution_contexts | default([])),
              'storage_container_name': storage_container_name
            } | to_json
          }}
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - storage_container_ext_id | default('') | length == 0
        - storage_container_name | default('') | length > 0

    - name: "Resolve storage container name by cluster concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["CONTAINER_LOOKUP_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["CONTAINER_LOOKUP_BASE_URL"]
        username = os.environ["CONTAINER_LOOKUP_USERNAME"]
        password = os.environ["CONTAINER_LOOKUP_PASSWORD"]
        retries = int(os.environ["CONTAINER_LOOKUP_RETRIES"])
        retry_delay = int(os.environ["CONTAINER_LOOKUP_RETRY_DELAY"])
        concurrency = int(os.environ["CONTAINER_LOOKUP_CONCURRENCY"])
        progress_every = int(os.environ["CONTAINER_LOOKUP_PROGRESS_EVERY"])
        vm_contexts = payload.get("vm_resolution_contexts", [])
        storage_container_name = payload.get("storage_container_name", "")

        unique_clusters = sorted(
            {
                ctx.get("vm_cluster_ext_id", "")
                for ctx in vm_contexts
                if isinstance(ctx, dict) and ctx.get("vm_cluster_ext_id", "")
            }
        )

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def resolve_cluster(cluster_ext_id: str) -> tuple[str, str, str]:
            escaped_name = storage_container_name.replace("'", "''")
            escaped_cluster = cluster_ext_id.replace("'", "''")
            filter_str = f"name eq '{escaped_name}' and clusterExtId eq '{escaped_cluster}'"
            url = f"{base_url}/api/vmm/v4.0/ahv/config/storage-containers?$filter={requests.utils.quote(filter_str, safe='')}&$page=0&$limit=50"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        data = response.json().get("data", []) or []
                        if len(data) == 1:
                            return cluster_ext_id, data[0].get("extId", ""), ""
                        if len(data) == 0:
                            return cluster_ext_id, "", f'No storage container named "{storage_container_name}" found in VM cluster {cluster_ext_id}'
                        return cluster_ext_id, "", f'Storage container name "{storage_container_name}" is ambiguous in VM cluster {cluster_ext_id}'
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return cluster_ext_id, "", last_error or f"Failed to resolve container for cluster {cluster_ext_id}"

        cluster_ext_id_to_container = {}
        cluster_ext_id_to_error = {}
        processed = 0
        total = len(unique_clusters)
        print(f"PROGRESS stage=container_lookup total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(resolve_cluster, cluster) for cluster in unique_clusters]
            for future in concurrent.futures.as_completed(futures):
                cluster_ext_id, container_ext_id, error = future.result()
                processed += 1
                if container_ext_id:
                    cluster_ext_id_to_container[cluster_ext_id] = container_ext_id
                else:
                    cluster_ext_id_to_error[cluster_ext_id] = error
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=container_lookup processed={processed}/{total} success={len(cluster_ext_id_to_container)} failed={len(cluster_ext_id_to_error)}",
                        flush=True,
                    )

        vm_named_container_by_vm = {}
        vm_name_resolution_error_by_vm = {}
        for ctx in vm_contexts:
            if not isinstance(ctx, dict):
                continue
            vm_ext_id = ctx.get("vm_ext_id", "")
            cluster_ext_id = ctx.get("vm_cluster_ext_id", "")
            if not vm_ext_id:
                continue
            if not cluster_ext_id:
                vm_name_resolution_error_by_vm[vm_ext_id] = "Storage container name resolution skipped because VM cluster extId was not found"
                continue
            resolved = cluster_ext_id_to_container.get(cluster_ext_id, "")
            if resolved:
                vm_named_container_by_vm[vm_ext_id] = resolved
            else:
                vm_name_resolution_error_by_vm[vm_ext_id] = cluster_ext_id_to_error.get(
                    cluster_ext_id, f"Failed to resolve storage container for cluster {cluster_ext_id}"
                )

        print(
            json.dumps(
                {
                    "vm_named_container_by_vm": vm_named_container_by_vm,
                    "vm_name_resolution_error_by_vm": vm_name_resolution_error_by_vm,
                    "cluster_count": len(unique_clusters),
                }
            )
        )
        PY
