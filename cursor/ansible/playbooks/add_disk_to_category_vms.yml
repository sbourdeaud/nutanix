    - name: "Attach disk to eligible VMs concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import uuid
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["ATTACH_SUBMIT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["ATTACH_SUBMIT_BASE_URL"]
        username = os.environ["ATTACH_SUBMIT_USERNAME"]
        password = os.environ["ATTACH_SUBMIT_PASSWORD"]
        retries = int(os.environ["ATTACH_SUBMIT_RETRIES"])
        retry_delay = int(os.environ["ATTACH_SUBMIT_RETRY_DELAY"])
        concurrency = int(os.environ["ATTACH_SUBMIT_CONCURRENCY"])
        progress_every = int(os.environ["ATTACH_SUBMIT_PROGRESS_EVERY"])

        vm_attach_final = payload.get("vm_attach_final", [])
        vm_etag_by_vm = payload.get("vm_etag_by_vm", {})
        custom_attributes = payload.get("custom_attributes", []) or []
        disk_size_bytes = int(payload.get("disk_size_bytes", 0))
        flash_mode_enabled = bool(payload.get("flash_mode_enabled", False))
        disk_bus_type = payload.get("disk_bus_type", "SCSI")

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def submit_attach(target: dict) -> tuple[str, str, str]:
            vm_ext_id = target.get("vm_ext_id", "")
            container_ext_id = target.get("target_storage_container_ext_id", "")
            attach_url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks"
            if_match = vm_etag_by_vm.get(vm_ext_id, "")

            request_id = str(uuid.uuid4())
            payload_body = {
                "$objectType": "vmm.v4.ahv.config.Disk",
                "$backingInfoItemDiscriminator": "vmm.v4.ahv.config.VmDisk",
                "diskAddress": {"$objectType": "vmm.v4.ahv.config.DiskAddress", "busType": disk_bus_type},
                "customAttributes": custom_attributes,
                "backingInfo": {
                    "$objectType": "vmm.v4.ahv.config.VmDisk",
                    "diskSizeBytes": disk_size_bytes,
                    "storageContainer": {
                        "$objectType": "vmm.v4.ahv.config.VmDiskContainerReference",
                        "extId": container_ext_id,
                    },
                    "storageConfig": {"isFlashModeEnabled": flash_mode_enabled},
                },
            }

            headers = {"Accept": "application/json", "Content-Type": "application/json", "NTNX-Request-Id": request_id}
            if if_match:
                headers["If-Match"] = if_match

            last_error = ""
            for _ in range(retries):
                try:
                    response = session.post(attach_url, headers=headers, json=payload_body, timeout=(5, 30))
                    if response.status_code in (200, 201, 202):
                        task_ext_id = (response.json().get("data", {}) or {}).get("extId", "")
                        if task_ext_id:
                            return vm_ext_id, f"{base_url}/api/prism/v4.0/config/tasks/{task_ext_id}", ""
                        last_error = "attach accepted but no task extId returned"
                    else:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return vm_ext_id, "", last_error or "unknown error"

        disk_attach_task_urls = {}
        changed_vm_ext_ids = []
        failed = []
        processed = 0
        total = len(vm_attach_final)
        print(f"PROGRESS stage=attach_submit total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(submit_attach, target) for target in vm_attach_final]
            for future in concurrent.futures.as_completed(futures):
                vm_ext_id, task_url, err = future.result()
                processed += 1
                if err:
                    failed.append({"vm_ext_id": vm_ext_id, "error": err})
                else:
                    disk_attach_task_urls[vm_ext_id] = task_url
                    changed_vm_ext_ids.append(vm_ext_id)
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=attach_submit processed={processed}/{total} success={len(changed_vm_ext_ids)} failed={len(failed)}",
                        flush=True,
                    )

        print(
            json.dumps(
                {
                    "disk_attach_task_urls": disk_attach_task_urls,
                    "changed_vm_ext_ids": changed_vm_ext_ids,
                    "failed": failed,
                }
            )
        )
        if failed:
            sys.exit(1)
        PY
      register: attach_submit_raw
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - (vm_attach_final | default([]) | length) > 0
      check_mode: false
      environment:
        ATTACH_SUBMIT_PAYLOAD_FILE: "{{ attach_submit_payload_file.path }}"
