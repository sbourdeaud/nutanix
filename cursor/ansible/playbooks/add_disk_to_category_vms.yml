        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["ATTACH_POLL_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        username = os.environ["ATTACH_POLL_USERNAME"]
        password = os.environ["ATTACH_POLL_PASSWORD"]
        retries = int(os.environ["ATTACH_POLL_RETRIES"])
        delay = int(os.environ["ATTACH_POLL_DELAY"])
        concurrency = int(os.environ["ATTACH_POLL_CONCURRENCY"])
        progress_every = int(os.environ["ATTACH_POLL_PROGRESS_EVERY"])
        disk_attach_task_urls = payload.get("disk_attach_task_urls", {})

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def poll_task(vm_ext_id: str, task_url: str) -> tuple[str, str, str]:
            last_status = "UNKNOWN"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(task_url, timeout=(5, 30))
                    if response.status_code != 200:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                        time.sleep(delay)
                        continue
                    data = (response.json().get("data", {}) or {})
                    last_status = data.get("status", "UNKNOWN")
                    if last_status in ("SUCCEEDED", "COMPLETED", "COMPLETE"):
                        return vm_ext_id, last_status, ""
                    if last_status in ("FAILED", "ERROR", "CANCELLED"):
                        return vm_ext_id, last_status, "Task ended unsuccessfully"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(delay)
            if last_error:
                return vm_ext_id, last_status, last_error
            return vm_ext_id, last_status, "Task poll retries exhausted"

        succeeded = []
        failed = []
        processed = 0
        total = len(disk_attach_task_urls)
        print(f"PROGRESS stage=attach_poll total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(poll_task, vm_ext_id, task_url) for vm_ext_id, task_url in disk_attach_task_urls.items()]
            for future in concurrent.futures.as_completed(futures):
                vm_ext_id, status, err = future.result()
                processed += 1
                if err:
                    failed.append({"vm_ext_id": vm_ext_id, "status": status, "error": err})
                else:
                    succeeded.append({"vm_ext_id": vm_ext_id, "status": status})
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=attach_poll processed={processed}/{total} success={len(succeeded)} failed={len(failed)}",
                        flush=True,
                    )

        print(json.dumps({"succeeded": succeeded, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: attach_poll_raw
      delegate_to: localhost
      check_mode: false
      when:
        - not ansible_check_mode
        - (disk_attach_task_urls | default({}) | length) > 0
      environment:
        ATTACH_POLL_PAYLOAD_FILE: "{{ attach_poll_payload_file.path }}"
        ATTACH_POLL_USERNAME: "{{ pc_username }}"
        ATTACH_POLL_PASSWORD: "{{ pc_password }}"
        ATTACH_POLL_RETRIES: "{{ task_poll_retries | default(40) | int }}"
        ATTACH_POLL_DELAY: "{{ task_poll_delay_seconds | default(5) | int }}"
        ATTACH_POLL_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        ATTACH_POLL_PROGRESS_EVERY: "{{ operation_progress_every | int }}"

    - name: "Set attach poll result facts"
      ansible.builtin.set_fact:
        attach_poll_json: "{{ (attach_poll_raw.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json }}"
      when:
        - not ansible_check_mode
        - (disk_attach_task_urls | default({}) | length) > 0

    - name: "Print concise attach poll summary"
      ansible.builtin.debug:
        msg:
          attach_poll_target_vm_count: "{{ (disk_attach_task_urls | default({})).keys() | list | length }}"
          attach_poll_success_vm_count: "{{ (attach_poll_json.succeeded | default([])) | length }}"
          attach_poll_failed_vm_count: "{{ (attach_poll_json.failed | default([])) | length }}"
      when:
        - not ansible_check_mode
        - (disk_attach_task_urls | default({}) | length) > 0

    - name: "Remove temporary attach task poll payload file"
      ansible.builtin.file:
        path: "{{ attach_poll_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - not ansible_check_mode
        - (disk_attach_task_urls | default({}) | length) > 0

    - name: "Collect changed and skipped VM extIds for disk reporting"
      ansible.builtin.set_fact:
        vm_ext_ids_for_report: >-
          {{
            (
              (vm_attach_final | default([]) | map(attribute='vm_ext_id') | list)
              +
              (vm_attach_skipped | default([]))
            ) | unique
          }}
      when: not ansible_check_mode

    - name: "Create temporary file for report disk fetch payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_attach_report_disk_payload.json"
      register: attach_report_disk_payload_file
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - (vm_ext_ids_for_report | default([]) | length) > 0
      check_mode: false
      no_log: true

    - name: "Write report disk fetch payload"
      ansible.builtin.copy:
        dest: "{{ attach_report_disk_payload_file.path }}"
        mode: "0600"
        content: >-
          {{
            {
              'vm_ext_ids_for_report': (vm_ext_ids_for_report | default([])),
              'matched_vms': (matched_vms | default([]))
            } | to_json
          }}
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - (vm_ext_ids_for_report | default([]) | length) > 0
      check_mode: false
      no_log: true

    - name: "Fetch attached disks and build report rows concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["ATTACH_REPORT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["ATTACH_REPORT_BASE_URL"]
        username = os.environ["ATTACH_REPORT_USERNAME"]
        password = os.environ["ATTACH_REPORT_PASSWORD"]
        retries = int(os.environ["ATTACH_REPORT_RETRIES"])
        retry_delay = int(os.environ["ATTACH_REPORT_RETRY_DELAY"])
        concurrency = int(os.environ["ATTACH_REPORT_CONCURRENCY"])
        progress_every = int(os.environ["ATTACH_REPORT_PROGRESS_EVERY"])
        vm_ids = payload.get("vm_ext_ids_for_report", [])
        matched_vms = payload.get("matched_vms", [])

        vm_name_by_id = {}
        for vm in matched_vms:
            if isinstance(vm, dict):
                vm_ext_id = vm.get("extId", "")
                if vm_ext_id:
                    vm_name_by_id[vm_ext_id] = vm.get("name", vm_ext_id)

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_one(vm_ext_id: str):
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks?$page=0&$limit=100"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        return vm_ext_id, (response.json().get("data", []) or []), ""
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return vm_ext_id, [], last_error or "unknown error"

        rows = []
        failed = []
        processed = 0
        total = len(vm_ids)
        print(f"PROGRESS stage=attach_report_disk_fetch total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(fetch_one, vm_ext_id) for vm_ext_id in vm_ids]
            for future in concurrent.futures.as_completed(futures):
                vm_ext_id, disks, err = future.result()
                processed += 1
                if err:
                    failed.append({"vm_ext_id": vm_ext_id, "error": err})
                else:
                    vm_name = vm_name_by_id.get(vm_ext_id, vm_ext_id)
                    for disk in disks:
                        backing = disk.get("backingInfo", {}) or {}
                        disk_address = disk.get("diskAddress", {}) or {}
                        storage_container = backing.get("storageContainer", {}) or {}
                        disk_size_bytes = float(backing.get("diskSizeBytes", 0) or 0)
                        rows.append(
                            {
                                "vm_ext_id": vm_ext_id,
                                "vm_name": vm_name,
                                "scsi_id": f"{disk_address.get('busType', 'UNKNOWN')}.{disk_address.get('index', '?')}",
                                "disk_size_gib": round(disk_size_bytes / 1073741824, 2),
                                "storage_container_ext_id": storage_container.get("extId", ""),
                                "custom_attributes": disk.get("customAttributes", []) or [],
                            }
                        )
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=attach_report_disk_fetch processed={processed}/{total} success={processed - len(failed)} failed={len(failed)}",
                        flush=True,
                    )

        print(json.dumps({"vm_disk_report_rows": rows, "failed": failed}))
        PY
      register: attach_report_disk_fetch_raw
      delegate_to: localhost
      check_mode: false
      when:
        - not ansible_check_mode
        - (vm_ext_ids_for_report | default([]) | length) > 0
      environment:
        ATTACH_REPORT_PAYLOAD_FILE: "{{ attach_report_disk_payload_file.path }}"
        ATTACH_REPORT_BASE_URL: "{{ prism_base_url }}"
        ATTACH_REPORT_USERNAME: "{{ pc_username }}"
        ATTACH_REPORT_PASSWORD: "{{ pc_password }}"
        ATTACH_REPORT_RETRIES: "{{ api_retries | int }}"
        ATTACH_REPORT_RETRY_DELAY: "{{ api_retry_delay_seconds | int }}"
        ATTACH_REPORT_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        ATTACH_REPORT_PROGRESS_EVERY: "{{ operation_progress_every | int }}"

    - name: "Set report rows from concurrent disk fetch"
      ansible.builtin.set_fact:
        vm_disk_report_rows: "{{ (((attach_report_disk_fetch_raw.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json).vm_disk_report_rows | default([])) }}"
        attach_report_disk_fetch_failed: "{{ (((attach_report_disk_fetch_raw.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json).failed | default([])) }}"
      when:
        - not ansible_check_mode
        - (vm_ext_ids_for_report | default([]) | length) > 0

    - name: "Fail when report disk fetch has failures"
      ansible.builtin.fail:
        msg: "Failed to fetch attached disks for report VMs: {{ attach_report_disk_fetch_failed }}"
      when:
        - not ansible_check_mode
        - (attach_report_disk_fetch_failed | default([]) | length) > 0

    - name: "Remove temporary report disk fetch payload file"
      ansible.builtin.file:
        path: "{{ attach_report_disk_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - not ansible_check_mode
        - (vm_ext_ids_for_report | default([]) | length) > 0

    - name: "Report attached disks for changed and skipped VMs"
      ansible.builtin.debug:
        msg: "{{ vm_disk_report_rows }}"
      when:
        - not ansible_check_mode
        - (vm_disk_report_rows | default([]) | length) > 0

    - name: "Print final operation summary"
      ansible.builtin.debug:
        msg:
          matched_vm_count: "{{ matched_vm_ext_ids | length }}"
          changed_vm_count: "{{ (changed_vm_ext_ids | default([]) | length) if not ansible_check_mode else (vm_attach_final | default([]) | length) }}"
          skipped_vm_count: "{{ vm_attach_skipped | length }}"
          failed_vm_count: 0
          skipped_vm_details: "{{ vm_skipped_reasons }}"
