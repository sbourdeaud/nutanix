      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["ATTACH_ETAG_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["ATTACH_ETAG_BASE_URL"]
        username = os.environ["ATTACH_ETAG_USERNAME"]
        password = os.environ["ATTACH_ETAG_PASSWORD"]
        retries = int(os.environ["ATTACH_ETAG_RETRIES"])
        retry_delay = int(os.environ["ATTACH_ETAG_RETRY_DELAY"])
        concurrency = int(os.environ["ATTACH_ETAG_CONCURRENCY"])
        progress_every = int(os.environ["ATTACH_ETAG_PROGRESS_EVERY"])
        targets = payload.get("vm_attach_final", [])

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_etag(target: dict) -> tuple[str, str, str]:
            vm_ext_id = target.get("vm_ext_id", "")
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        return vm_ext_id, response.headers.get("ETag", ""), ""
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(retry_delay)
            return vm_ext_id, "", last_error or "unknown error"

        vm_etag_by_vm = {}
        failed = []
        processed = 0
        total = len(targets)
        print(f"PROGRESS stage=attach_etag_fetch total={total}", flush=True)
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(fetch_etag, target) for target in targets]
            for future in concurrent.futures.as_completed(futures):
                vm_ext_id, etag, err = future.result()
                processed += 1
                if err:
                    failed.append({"vm_ext_id": vm_ext_id, "error": err})
                else:
                    vm_etag_by_vm[vm_ext_id] = etag
                if (processed % progress_every == 0) or (processed == total):
                    print(
                        f"PROGRESS stage=attach_etag_fetch processed={processed}/{total} success={len(vm_etag_by_vm)} failed={len(failed)}",
                        flush=True,
                    )

        print(json.dumps({"vm_etag_by_vm": vm_etag_by_vm, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
