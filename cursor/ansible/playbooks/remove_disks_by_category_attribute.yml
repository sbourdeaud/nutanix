        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import uuid
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["DELETE_BASE_URL"]
        username = os.environ["DELETE_USERNAME"]
        password = os.environ["DELETE_PASSWORD"]
        vm_targets = json.loads(os.environ["DELETE_VM_TARGETS"])
        initial_etags = json.loads(os.environ["DELETE_INITIAL_ETAGS"])
        api_retries = int(os.environ["DELETE_API_RETRIES"])
        api_retry_delay = int(os.environ["DELETE_API_RETRY_DELAY"])
        concurrency = int(os.environ["DELETE_SUBMIT_CONCURRENCY"])
        progress_every = int(os.environ["DELETE_PROGRESS_EVERY"])
        rate_limit_backoff_max = int(os.environ.get("DELETE_RATE_LIMIT_BACKOFF_MAX", "30"))
        rate_limit_retry_rounds = int(os.environ.get("DELETE_RATE_LIMIT_RETRY_ROUNDS", "2"))

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_fresh_etag(vm_ext_id: str):
            vm_url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}"
            last_error = ""
            for _ in range(api_retries):
                try:
                    response = session.get(vm_url, timeout=(5, 30))
                    if response.status_code == 200:
                        etag = response.headers.get("ETag", "")
                        if etag:
                            return etag, ""
                        last_error = "ETag header missing"
                    else:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(api_retry_delay)
            return "", last_error or "ETag refresh failed after retries"

        def compute_backoff_seconds(attempt_idx: int, response=None) -> float:
            retry_after = ""
            if response is not None:
                retry_after = (response.headers.get("Retry-After", "") or "").strip()
            if retry_after.isdigit():
                return float(min(rate_limit_backoff_max, max(1, int(retry_after))))
            # Exponential backoff with light deterministic jitter.
            base = max(1, api_retry_delay)
            jitter = ((attempt_idx % 3) * 0.25)
            return float(min(rate_limit_backoff_max, (base * (2 ** attempt_idx)) + jitter))

        def submit_for_vm(vm_target: dict) -> dict:
            vm_ext_id = vm_target.get("vm_ext_id", "")
            disks = vm_target.get("disks", []) or []
            current_etag = initial_etags.get(vm_ext_id, "")
            vm_deleted = []
            vm_submit_failed = []
            vm_task_targets = []

            if not vm_ext_id:
                return {"deleted": vm_deleted, "submit_failed": vm_submit_failed, "task_targets": vm_task_targets}
            if not current_etag:
                vm_submit_failed.extend(
                    [
                        {
                            "vm_ext_id": vm_ext_id,
                            "disk_ext_id": disk.get("disk_ext_id", ""),
                            "reason": "Initial ETag not available for VM",
                        }
                        for disk in disks
                    ]
                )
                return {"deleted": vm_deleted, "submit_failed": vm_submit_failed, "task_targets": vm_task_targets}

            for disk_index, disk in enumerate(disks):
                disk_ext_id = disk.get("disk_ext_id", "")
                delete_url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks/{disk_ext_id}"
                headers = {"NTNX-Request-Id": str(uuid.uuid4()), "If-Match": current_etag}
                delete_ok = False
                delete_resp = None
                last_error = ""
                rate_limited = False

                for attempt_idx in range(api_retries):
                    try:
                        delete_resp = session.delete(delete_url, headers=headers, timeout=(5, 30))
                        if delete_resp.status_code in (200, 202):
                            delete_ok = True
                            break
                        if delete_resp.status_code == 429:
                            rate_limited = True
                            last_error = f"HTTP 429: {delete_resp.text}"
                            time.sleep(compute_backoff_seconds(attempt_idx, delete_resp))
                            continue
                        last_error = f"HTTP {delete_resp.status_code}: {delete_resp.text}"
                    except Exception as exc:
                        last_error = str(exc)
                    time.sleep(api_retry_delay)

                if not delete_ok or delete_resp is None:
                    vm_submit_failed.append(
                        {
                            "vm_ext_id": vm_ext_id,
                            "disk_ext_id": disk_ext_id,
                            "reason": last_error or "Delete request failed after retries",
                            "error_group": ("RATE_LIMIT_EXCEEDED" if rate_limited else "SUBMIT_FAILED"),
                        }
                    )
                    continue

                if delete_resp.status_code == 200:
                    vm_deleted.append(
                        {
                            "vm_ext_id": vm_ext_id,
                            "disk_ext_id": disk_ext_id,
                            "task_status": "COMPLETED",
                        }
                    )
                else:
                    try:
                        task_ext_id = delete_resp.json().get("data", {}).get("extId", "")
                    except Exception:
                        task_ext_id = ""
                    if not task_ext_id:
                        vm_submit_failed.append(
                            {
                                "vm_ext_id": vm_ext_id,
                                "disk_ext_id": disk_ext_id,
                                "reason": "Delete accepted but no task extId returned",
                            }
                        )
                    else:
                        vm_task_targets.append(
                            {
                                "vm_ext_id": vm_ext_id,
                                "disk_ext_id": disk_ext_id,
                                "task_url": f"{base_url}/api/prism/v4.0/config/tasks/{task_ext_id}",
                            }
                        )

                # For VMs with multiple delete targets, refresh ETag after each successful delete submit.
                if disk_index < (len(disks) - 1):
                    fresh_etag, etag_err = fetch_fresh_etag(vm_ext_id)
                    if not fresh_etag:
                        vm_submit_failed.extend(
                            [
                                {
                                    "vm_ext_id": vm_ext_id,
                                    "disk_ext_id": remaining_disk.get("disk_ext_id", ""),
                                    "reason": f"ETag refresh failed for subsequent disk deletes: {etag_err}",
                                }
                                for remaining_disk in disks[disk_index + 1 :]
                            ]
                        )
                        break
                    current_etag = fresh_etag

            return {"deleted": vm_deleted, "submit_failed": vm_submit_failed, "task_targets": vm_task_targets}

        deleted = []
        submit_failed = []
        task_targets = []
        processed_vm = 0
        total_vm = len(vm_targets)
        total_targets = sum(len(vm_target.get("disks", []) or []) for vm_target in vm_targets)
        print(f"PROGRESS stage=delete_submit total_vms={total_vm} total_disks={total_targets}", flush=True)

        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(submit_for_vm, vm_target) for vm_target in vm_targets]
            for future in concurrent.futures.as_completed(futures):
                result = future.result()
                processed_vm += 1
                deleted.extend(result.get("deleted", []))
                submit_failed.extend(result.get("submit_failed", []))
                task_targets.extend(result.get("task_targets", []))

                processed_disks = len(deleted) + len(submit_failed) + len(task_targets)
                if (processed_vm % progress_every == 0) or (processed_vm == total_vm):
                    print(
                        f"PROGRESS stage=delete_submit processed_vms={processed_vm}/{total_vm} processed_disks={processed_disks}/{total_targets} immediate_deleted={len(deleted)} queued_for_poll={len(task_targets)} failed={len(submit_failed)}",
                        flush=True,
                    )

        # Controlled second-pass retries for explicit rate-limited submit failures.
        for retry_round in range(rate_limit_retry_rounds):
            rate_limited_failures = [item for item in submit_failed if item.get("error_group", "") == "RATE_LIMIT_EXCEEDED"]
            if not rate_limited_failures:
                break

            print(
                f"PROGRESS stage=delete_submit_rate_limit_retry round={retry_round + 1}/{rate_limit_retry_rounds} targets={len(rate_limited_failures)}",
                flush=True,
            )

            # Remove rate-limited failures from current failure set for reprocessing.
            submit_failed = [item for item in submit_failed if item.get("error_group", "") != "RATE_LIMIT_EXCEEDED"]

            retry_vm_map = {}
            for item in rate_limited_failures:
                vm_ext_id = item.get("vm_ext_id", "")
                disk_ext_id = item.get("disk_ext_id", "")
                if not vm_ext_id or not disk_ext_id:
                    continue
                retry_vm_map.setdefault(vm_ext_id, []).append({"vm_ext_id": vm_ext_id, "disk_ext_id": disk_ext_id})

            retry_vm_targets = [{"vm_ext_id": vm_ext_id, "disks": disks} for vm_ext_id, disks in retry_vm_map.items()]
            if not retry_vm_targets:
                break

            # Refresh initial ETag per retry VM before re-submit.
            refreshed_initial_etags = {}
            for vm_target in retry_vm_targets:
                vm_ext_id = vm_target.get("vm_ext_id", "")
                fresh_etag, etag_err = fetch_fresh_etag(vm_ext_id)
                if not fresh_etag:
                    submit_failed.extend(
                        [
                            {
                                "vm_ext_id": vm_ext_id,
                                "disk_ext_id": disk.get("disk_ext_id", ""),
                                "reason": f"ETag refresh failed before rate-limit retry: {etag_err}",
                                "error_group": "ETAG_REFRESH_FAILED",
                            }
                            for disk in (vm_target.get("disks", []) or [])
                        ]
                    )
                else:
                    refreshed_initial_etags[vm_ext_id] = fresh_etag

            effective_retry_vm_targets = [vm_target for vm_target in retry_vm_targets if vm_target.get("vm_ext_id", "") in refreshed_initial_etags]
            if not effective_retry_vm_targets:
                continue

            original_initial_etags = initial_etags
            initial_etags = refreshed_initial_etags
            try:
                with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
                    futures = [executor.submit(submit_for_vm, vm_target) for vm_target in effective_retry_vm_targets]
                    for future in concurrent.futures.as_completed(futures):
                        result = future.result()
                        deleted.extend(result.get("deleted", []))
                        submit_failed.extend(result.get("submit_failed", []))
                        task_targets.extend(result.get("task_targets", []))
            finally:
                initial_etags = original_initial_etags

        print(json.dumps({"deleted": deleted, "submit_failed": submit_failed, "task_targets": task_targets}))
