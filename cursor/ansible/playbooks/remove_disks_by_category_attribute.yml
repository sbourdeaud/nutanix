---
- name: "Remove VM disks by category and custom attribute"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/disk_remove_defaults.yml"
  vars:
    ansible_python_interpreter: "{{ (playbook_dir | dirname) + '/.venv/bin/python' }}"
    prism_base_url: "https://{{ pc_ip }}:9440"
    vm_list_endpoint: "/api/vmm/v4.0/ahv/config/vms"
    category_list_endpoint: "/api/prism/v4.0/config/categories"
    vm_disk_list_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s/disks"
    vm_disk_delete_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s/disks/%s"
    vm_get_endpoint_template: "/api/vmm/v4.0/ahv/config/vms/%s"
    request_headers:
      Content-Type: "application/json"
      Accept: "application/json"
      Cache-Control: "no-cache"
  tasks:
    - name: "Validate required inputs"
      ansible.builtin.assert:
        that:
          - pc_ip is defined and pc_ip | length > 0
          - pc_username is defined and pc_username | length > 0
          - pc_password is defined and pc_password | length > 0
          - category_key is defined and category_key | length > 0
          - category_value is defined and category_value | length > 0
          - disk_custom_attribute is defined and disk_custom_attribute | length > 0
        fail_msg: >-
          Missing required variables. Required: pc_ip, pc_username, pc_password,
          category_key, category_value, disk_custom_attribute.
      check_mode: false

    - name: "Validate destructive-action confirmation"
      ansible.builtin.assert:
        that:
          - (not require_confirmation | bool) or (delete_confirm | default('') == confirmation_value)
        fail_msg: >-
          Disk removal is destructive. Set -e delete_confirm={{ confirmation_value }}
          (or set require_confirmation=false) to proceed.
      when: not ansible_check_mode

    - name: "Resolve category extId"
      ansible.builtin.uri:
        url: "{{ prism_base_url }}{{ category_list_endpoint }}?$filter={{ category_filter | urlencode }}&$page=0&$limit=50"
        method: GET
        url_username: "{{ pc_username }}"
        url_password: "{{ pc_password }}"
        force_basic_auth: true
        headers: "{{ request_headers }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: category_lookup
      delegate_to: localhost
      check_mode: false
      no_log: true
      vars:
        category_filter: "key eq '{{ category_key | replace(\"'\", \"''\") }}' and value eq '{{ category_value | replace(\"'\", \"''\") }}'"

    - name: "Fail when category is not unique"
      ansible.builtin.fail:
        msg: "Category '{{ category_key }}:{{ category_value }}' must resolve to exactly one category. Found: {{ category_lookup.json.data | default([]) | length }}"
      when: category_lookup.json.data | default([]) | length != 1

    - name: "Set resolved category extId"
      ansible.builtin.set_fact:
        category_ext_id: "{{ category_lookup.json.data[0].extId }}"

    - name: "Fetch first page of VMs with retry backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])

        url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page=0&$limit={page_limit}"
        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        last_error = ""
        for attempt in range(retries):
            try:
                response = requests.get(
                    url,
                    auth=(username, password),
                    headers=headers,
                    verify=False,
                    timeout=(5, timeout_seconds),
                )
                if response.status_code == 200:
                    print(response.text)
                    sys.exit(0)
                last_error = f"HTTP {response.status_code}: {response.text}"
            except Exception as exc:
                last_error = str(exc)
            time.sleep(backoff * (2 ** attempt))

        print(json.dumps({"error": last_error}))
        sys.exit(1)
        PY
      register: vm_page_0_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"

    - name: "Parse first page VM response"
      ansible.builtin.set_fact:
        vm_page_0_json: "{{ vm_page_0_raw.stdout | from_json }}"

    - name: "Initialize VM pagination facts"
      ansible.builtin.set_fact:
        total_available_vms: "{{ vm_page_0_json.metadata.totalAvailableResults | default(vm_page_0_json.data | default([]) | length) | int }}"
        all_vms: "{{ vm_page_0_json.data | default([]) }}"

    - name: "Compute VM total page count"
      ansible.builtin.set_fact:
        total_vm_pages: "{{ ((total_available_vms | int) + (api_page_limit | int) - 1) // (api_page_limit | int) }}"

    - name: "Fetch remaining VM pages concurrently with backoff"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["PAGE_BASE_URL"]
        username = os.environ["PAGE_USERNAME"]
        password = os.environ["PAGE_PASSWORD"]
        page_limit = int(os.environ["PAGE_LIMIT"])
        total_pages = int(os.environ["TOTAL_PAGES"])
        retries = int(os.environ["PAGE_FETCH_RETRIES"])
        backoff = int(os.environ["PAGE_FETCH_BACKOFF_SECONDS"])
        timeout_seconds = int(os.environ["PAGE_FETCH_TIMEOUT_SECONDS"])
        concurrency = int(os.environ["PAGE_FETCH_CONCURRENCY"])

        headers = {"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"}

        def fetch_page(page_num: int):
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms?$page={page_num}&$limit={page_limit}"
            last_error = ""
            for attempt in range(retries):
                try:
                    response = requests.get(
                        url,
                        auth=(username, password),
                        headers=headers,
                        verify=False,
                        timeout=(5, timeout_seconds),
                    )
                    if response.status_code == 200:
                        payload = response.json()
                        return {"page": page_num, "data": payload.get("data", [])}
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(backoff * (2 ** attempt))
            return {"page": page_num, "error": last_error or "unknown error"}

        pages = []
        failed = []
        if total_pages > 1:
            page_numbers = list(range(1, total_pages))
            with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as executor:
                futures = [executor.submit(fetch_page, p) for p in page_numbers]
                for future in concurrent.futures.as_completed(futures):
                    result = future.result()
                    if "error" in result:
                        failed.append(result)
                    else:
                        pages.append(result)

        pages.sort(key=lambda item: item["page"])
        print(json.dumps({"pages": pages, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: vm_other_pages_raw
      delegate_to: localhost
      when: total_vm_pages | int > 1
      check_mode: false
      no_log: true
      environment:
        PAGE_BASE_URL: "{{ prism_base_url }}"
        PAGE_USERNAME: "{{ pc_username }}"
        PAGE_PASSWORD: "{{ pc_password }}"
        PAGE_LIMIT: "{{ api_page_limit | int }}"
        TOTAL_PAGES: "{{ total_vm_pages | int }}"
        PAGE_FETCH_RETRIES: "{{ vm_page_fetch_retries | int }}"
        PAGE_FETCH_BACKOFF_SECONDS: "{{ vm_page_fetch_backoff_seconds | int }}"
        PAGE_FETCH_TIMEOUT_SECONDS: "{{ vm_page_fetch_timeout_seconds | int }}"
        PAGE_FETCH_CONCURRENCY: "{{ vm_page_fetch_concurrency | int }}"

    - name: "Parse remaining VM pages response"
      ansible.builtin.set_fact:
        vm_other_pages_json: "{{ vm_other_pages_raw.stdout | from_json }}"
      when: total_vm_pages | int > 1

    - name: "Merge paginated VM results"
      ansible.builtin.set_fact:
        all_vms: "{{ all_vms + (vm_other_pages_json.pages | default([]) | map(attribute='data') | list | flatten) }}"
      when: total_vm_pages | int > 1

    - name: "Create temporary file for VM filtering input"
      ansible.builtin.tempfile:
        state: file
        suffix: "_remove_vm_filtering_input.json"
      register: remove_vm_filtering_input_file
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Write VM filtering input payload"
      ansible.builtin.copy:
        dest: "{{ remove_vm_filtering_input_file.path }}"
        mode: "0600"
        content: "{{ {'all_vms': all_vms | default([]), 'category_ext_id': category_ext_id} | to_json }}"
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Filter category-matched VMs in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["REMOVE_VM_FILTER_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        all_vms = payload.get("all_vms", [])
        category_ext_id = payload.get("category_ext_id", "")

        matched_vms = []
        matched_vm_ext_ids = []

        for vm in all_vms:
            vm_ext_id = vm.get("extId", "")
            if not vm_ext_id:
                continue
            categories = vm.get("categories", []) or []
            vm_category_ext_ids = [cat.get("extId", "") for cat in categories if isinstance(cat, dict)]
            if category_ext_id in vm_category_ext_ids:
                matched_vms.append(vm)
                matched_vm_ext_ids.append(vm_ext_id)

        print(json.dumps({"matched_vms": matched_vms, "matched_vm_ext_ids": matched_vm_ext_ids}))
        PY
      register: remove_vm_filtering_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        REMOVE_VM_FILTER_PAYLOAD_FILE: "{{ remove_vm_filtering_input_file.path }}"

    - name: "Parse VM filtering output"
      ansible.builtin.set_fact:
        remove_vm_filtering_json: "{{ remove_vm_filtering_raw.stdout | from_json }}"

    - name: "Set matched VMs and extIds"
      ansible.builtin.set_fact:
        matched_vms: "{{ remove_vm_filtering_json.matched_vms | default([]) }}"
        matched_vm_ext_ids: "{{ remove_vm_filtering_json.matched_vm_ext_ids | default([]) }}"

    - name: "Remove temporary VM filtering input file"
      ansible.builtin.file:
        path: "{{ remove_vm_filtering_input_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true

    - name: "Report no-op when no VM matches category"
      ansible.builtin.debug:
        msg: "No VMs matched category {{ category_key }}:{{ category_value }}. Nothing to do."
      when: matched_vm_ext_ids | length == 0

    - name: "Create temporary file for remove disk inventory payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_remove_disk_inventory_payload.json"
      register: remove_disk_inventory_payload_file
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Write remove disk inventory payload"
      ansible.builtin.copy:
        dest: "{{ remove_disk_inventory_payload_file.path }}"
        mode: "0600"
        content: "{{ {'matched_vms': (matched_vms | default([]))} | to_json }}"
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Build embedded disk map and fallback VM list in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["REMOVE_DISK_INVENTORY_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        matched_vms = payload.get("matched_vms", [])
        embedded_disks_by_vm = {}
        fallback_vm_ext_ids = []

        for vm in matched_vms:
            vm_ext_id = vm.get("extId", "")
            if not vm_ext_id:
                continue
            vm_disks = vm.get("disks", [])
            if isinstance(vm_disks, list) and len(vm_disks) > 0:
                embedded_disks_by_vm[vm_ext_id] = vm_disks
            else:
                fallback_vm_ext_ids.append(vm_ext_id)

        print(
            json.dumps(
                {
                    "embedded_disks_by_vm": embedded_disks_by_vm,
                    "fallback_vm_ext_ids": fallback_vm_ext_ids,
                }
            )
        )
        PY
      register: remove_disk_inventory_build_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0
      environment:
        REMOVE_DISK_INVENTORY_PAYLOAD_FILE: "{{ remove_disk_inventory_payload_file.path }}"

    - name: "Set remove embedded/fallback disk inventory facts"
      ansible.builtin.set_fact:
        embedded_disks_by_vm: "{{ (remove_disk_inventory_build_raw.stdout | from_json).embedded_disks_by_vm | default({}) }}"
        fallback_vm_ext_ids: "{{ (remove_disk_inventory_build_raw.stdout | from_json).fallback_vm_ext_ids | default([]) }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Remove temporary remove disk inventory payload file"
      ansible.builtin.file:
        path: "{{ remove_disk_inventory_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Fetch fallback disks concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import sys
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        base_url = os.environ["FALLBACK_BASE_URL"]
        username = os.environ["FALLBACK_USERNAME"]
        password = os.environ["FALLBACK_PASSWORD"]
        vm_ids = json.loads(os.environ["FALLBACK_VM_IDS"])
        retries = int(os.environ["FALLBACK_RETRIES"])
        retry_delay = int(os.environ["FALLBACK_RETRY_DELAY"])
        max_workers = int(os.environ["FALLBACK_CONCURRENCY"])
        progress_every = int(os.environ["FALLBACK_PROGRESS_EVERY"])

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json"})

        def fetch_disks(vm_ext_id: str) -> tuple[str, list, str]:
            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks?$page=0&$limit=100"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 30))
                    if response.status_code == 200:
                        payload = response.json()
                        return vm_ext_id, payload.get("data", []), ""
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                import time
                time.sleep(retry_delay)
            return vm_ext_id, [], last_error or "unknown error"

        success = {}
        failed = []
        processed = 0
        total = len(vm_ids)
        print(f"PROGRESS stage=remove_fallback_disk_fetch total={total}", flush=True)
        if vm_ids:
            with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as executor:
                futures = [executor.submit(fetch_disks, vm_id) for vm_id in vm_ids]
                for future in concurrent.futures.as_completed(futures):
                    vm_id, disks, err = future.result()
                    processed += 1
                    if err:
                        failed.append({"vm_ext_id": vm_id, "error": err})
                    else:
                        success[vm_id] = disks
                    if (processed % progress_every == 0) or (processed == total):
                        print(
                            f"PROGRESS stage=remove_fallback_disk_fetch processed={processed}/{total} success={len(success)} failed={len(failed)}",
                            flush=True,
                        )

        print(json.dumps({"success": success, "failed": failed}))
        if failed:
            sys.exit(1)
        PY
      register: fallback_disk_fetch_raw
      delegate_to: localhost
      check_mode: false
      when: fallback_vm_ext_ids | default([]) | length > 0
      environment:
        FALLBACK_BASE_URL: "{{ prism_base_url }}"
        FALLBACK_USERNAME: "{{ pc_username }}"
        FALLBACK_PASSWORD: "{{ pc_password }}"
        FALLBACK_VM_IDS: "{{ fallback_vm_ext_ids | default([]) | to_json }}"
        FALLBACK_RETRIES: "{{ api_retries | int }}"
        FALLBACK_RETRY_DELAY: "{{ api_retry_delay_seconds | int }}"
        FALLBACK_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        FALLBACK_PROGRESS_EVERY: "{{ operation_progress_every | int }}"

    - name: "Parse fallback disk fetch result"
      ansible.builtin.set_fact:
        fallback_disk_fetch_json: "{{ (fallback_disk_fetch_raw.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json }}"
      when: fallback_vm_ext_ids | default([]) | length > 0

    - name: "Initialize empty fallback disk map when not needed"
      ansible.builtin.set_fact:
        fallback_disks_by_vm: {}
      when: fallback_vm_ext_ids | default([]) | length == 0

    - name: "Set fallback disk map from fetch result"
      ansible.builtin.set_fact:
        fallback_disks_by_vm: "{{ fallback_disk_fetch_json.success | default({}) }}"
      when: fallback_vm_ext_ids | default([]) | length > 0

    - name: "Merge embedded and fallback disk maps"
      ansible.builtin.set_fact:
        vm_disks_by_vm: "{{ embedded_disks_by_vm | combine(fallback_disks_by_vm) }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Create temporary file for deletion-target payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_delete_target_payload.json"
      register: delete_target_payload_file
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Write deletion-target payload"
      ansible.builtin.copy:
        dest: "{{ delete_target_payload_file.path }}"
        mode: "0600"
        content: >-
          {{
            {
              'matched_vms': (matched_vms | default([])),
              'vm_disks_by_vm': (vm_disks_by_vm | default({})),
              'disk_custom_attribute': disk_custom_attribute
            } | to_json
          }}
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Build disk deletion targets in one Python pass"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import json
        import os

        payload_file = os.environ["DELETE_TARGET_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)
        matched_vms = payload.get("matched_vms", [])
        vm_disks_by_vm = payload.get("vm_disks_by_vm", {})
        disk_custom_attribute = payload.get("disk_custom_attribute", "")

        vm_name_by_ext_id = {}
        for vm in matched_vms:
            ext_id = vm.get("extId", "")
            if ext_id:
                vm_name_by_ext_id[ext_id] = vm.get("name") or ext_id

        targets = []
        for vm_ext_id, disks in vm_disks_by_vm.items():
            vm_name = vm_name_by_ext_id.get(vm_ext_id, vm_ext_id)
            for disk in disks or []:
                disk_address = disk.get("diskAddress", {}) or {}
                bus_type = disk_address.get("busType", "UNKNOWN")
                index = disk_address.get("index", "?")
                is_scsi_zero = bus_type == "SCSI" and index == 0
                custom_attributes = disk.get("customAttributes", []) or []
                custom_attr_matches = disk_custom_attribute in custom_attributes
                if is_scsi_zero or not custom_attr_matches:
                    continue
                disk_size_bytes = (((disk.get("backingInfo", {}) or {}).get("diskSizeBytes", 0)) or 0)
                targets.append(
                    {
                        "vm_ext_id": vm_ext_id,
                        "vm_name": vm_name,
                        "disk_ext_id": disk.get("extId", ""),
                        "scsi_id": f"{bus_type}.{index}",
                        "disk_size_gib": round(float(disk_size_bytes) / 1073741824, 2),
                        "custom_attributes": custom_attributes,
                    }
                )

        print(json.dumps({"disk_delete_targets": targets}))
        PY
      register: delete_target_build_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0
      environment:
        DELETE_TARGET_PAYLOAD_FILE: "{{ delete_target_payload_file.path }}"

    - name: "Set deletion target list from Python result"
      ansible.builtin.set_fact:
        disk_delete_targets: "{{ (delete_target_build_raw.stdout | from_json).disk_delete_targets | default([]) }}"
      when: matched_vm_ext_ids | length > 0

    - name: "Remove temporary deletion-target payload file"
      ansible.builtin.file:
        path: "{{ delete_target_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: matched_vm_ext_ids | length > 0

    - name: "Initialize deletion target list when no matched VMs"
      ansible.builtin.set_fact:
        disk_delete_targets: []
      when: matched_vm_ext_ids | length == 0

    - name: "Show check mode delete preview"
      ansible.builtin.debug:
        msg:
          matched_vm_count: "{{ matched_vm_ext_ids | length }}"
          disk_custom_attribute: "{{ disk_custom_attribute }}"
          would_delete_disk_count: "{{ disk_delete_targets | length }}"
          would_delete_disks: "{{ disk_delete_targets }}"
      when: ansible_check_mode

    - name: "Create temporary file for delete submit payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_delete_submit_payload.json"
      register: delete_submit_payload_file
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - (disk_delete_targets | default([]) | length) > 0
      check_mode: false
      no_log: true

    - name: "Write delete submit payload"
      ansible.builtin.copy:
        dest: "{{ delete_submit_payload_file.path }}"
        mode: "0600"
        content: "{{ {'disk_delete_targets': (disk_delete_targets | default([]))} | to_json }}"
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - (disk_delete_targets | default([]) | length) > 0
      check_mode: false
      no_log: true

    - name: "Prefetch VM ETags for delete targets concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["DELETE_SUBMIT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        base_url = os.environ["DELETE_BASE_URL"]
        username = os.environ["DELETE_USERNAME"]
        password = os.environ["DELETE_PASSWORD"]
        api_retries = int(os.environ["DELETE_API_RETRIES"])
        api_retry_delay = int(os.environ["DELETE_API_RETRY_DELAY"])
        concurrency = int(os.environ["DELETE_SUBMIT_CONCURRENCY"])
        progress_every = int(os.environ["DELETE_PROGRESS_EVERY"])
        rate_limit_backoff_max = int(os.environ.get("DELETE_RATE_LIMIT_BACKOFF_MAX", "30"))
        rate_limit_retry_rounds = int(os.environ.get("DELETE_RATE_LIMIT_RETRY_ROUNDS", "2"))

        targets = payload.get("disk_delete_targets", []) or []

        vm_to_disks = {}
        for target in targets:
            vm_ext_id = target.get("vm_ext_id", "")
            disk_ext_id = target.get("disk_ext_id", "")
            if not vm_ext_id or not disk_ext_id:
                continue
            vm_to_disks.setdefault(vm_ext_id, []).append(target)

        vm_targets = [{"vm_ext_id": vm_ext_id, "disks": disks} for vm_ext_id, disks in vm_to_disks.items()]

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def compute_backoff_seconds(attempt_idx: int, response=None) -> float:
            retry_after = ""
            if response is not None:
                retry_after = (response.headers.get("Retry-After", "") or "").strip()
            if retry_after.isdigit():
                return float(min(rate_limit_backoff_max, max(1, int(retry_after))))
            base = max(1, api_retry_delay)
            jitter = ((attempt_idx % 3) * 0.25)
            return float(min(rate_limit_backoff_max, (base * (2 ** attempt_idx)) + jitter))

        def fetch_etag(vm_ext_id: str):
            vm_url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}"
            last_error = ""
            for attempt_idx in range(api_retries):
                try:
                    response = session.get(vm_url, timeout=(5, 30))
                    if response.status_code == 200:
                        return vm_ext_id, response.headers.get("ETag", ""), ""
                    if response.status_code == 429:
                        last_error = f"HTTP 429: {response.text}"
                        time.sleep(compute_backoff_seconds(attempt_idx, response))
                        continue
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(api_retry_delay)
            return vm_ext_id, "", last_error or "ETag fetch failed after retries"

        def prefetch_vm_ids(vm_ids: list[str], stage_name: str):
            stage_success = {}
            stage_failed = []
            stage_processed = 0
            stage_total = len(vm_ids)
            print(f"PROGRESS stage={stage_name} total={stage_total}", flush=True)
            with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
                futures = [executor.submit(fetch_etag, vm_ext_id) for vm_ext_id in vm_ids]
                for future in concurrent.futures.as_completed(futures):
                    vm_ext_id, etag, err = future.result()
                    stage_processed += 1
                    if err or not etag:
                        stage_failed.append({"vm_ext_id": vm_ext_id, "reason": err or "ETag header missing"})
                    else:
                        stage_success[vm_ext_id] = etag
                    if (stage_processed % progress_every == 0) or (stage_processed == stage_total):
                        print(
                            f"PROGRESS stage={stage_name} processed={stage_processed}/{stage_total} success={len(stage_success)} failed={len(stage_failed)}",
                            flush=True,
                        )
            return stage_success, stage_failed

        vm_ids = sorted(vm_to_disks.keys())
        vm_etag_by_vm, etag_failed = prefetch_vm_ids(vm_ids, "delete_etag_prefetch")

        for retry_round in range(rate_limit_retry_rounds):
            if not etag_failed:
                break
            retry_vm_ids = sorted({item.get("vm_ext_id", "") for item in etag_failed if item.get("vm_ext_id", "")})
            if not retry_vm_ids:
                break
            print(
                f"PROGRESS stage=delete_etag_prefetch_retry round={retry_round + 1}/{rate_limit_retry_rounds} targets={len(retry_vm_ids)}",
                flush=True,
            )
            retry_success, retry_failed = prefetch_vm_ids(retry_vm_ids, "delete_etag_prefetch_retry")
            vm_etag_by_vm.update(retry_success)
            etag_failed = retry_failed

        print(json.dumps({"vm_targets": vm_targets, "vm_etag_by_vm": vm_etag_by_vm, "etag_failed": etag_failed}))
