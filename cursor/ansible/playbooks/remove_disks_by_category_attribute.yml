      register: disk_delete_poll
      delegate_to: localhost
      check_mode: false
      when:
        - not ansible_check_mode
        - (delete_submit_summary.task_targets | default([]) | length) > 0
      environment:
        DELETE_POLL_TARGETS: "{{ delete_poll_chunk | to_json }}"
        DELETE_POLL_USERNAME: "{{ pc_username }}"
        DELETE_POLL_PASSWORD: "{{ pc_password }}"
        DELETE_POLL_RETRIES: "{{ task_poll_retries | int }}"
        DELETE_POLL_DELAY: "{{ task_poll_delay_seconds | int }}"
        DELETE_POLL_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        DELETE_PROGRESS_EVERY: "{{ delete_progress_every | int }}"
      loop: "{{ (not ansible_check_mode) | ternary((delete_submit_summary.task_targets | default([]) | batch(delete_chunk_size | int) | list), []) }}"
      loop_control:
        loop_var: delete_poll_chunk
        index_var: delete_poll_chunk_index
        label: "poll_chunk size={{ delete_poll_chunk | length }}"

    - name: "Initialize aggregate delete poll summary"
      ansible.builtin.set_fact:
        delete_poll_summary:
          deleted: []
          failed: []
      when:
        - not ansible_check_mode
        - (delete_submit_summary.task_targets | default([]) | length) > 0

    - name: "Merge delete poll summary chunks"
      ansible.builtin.set_fact:
        delete_poll_summary:
          deleted: "{{ (delete_poll_summary.deleted | default([])) + (poll_chunk_json.deleted | default([])) }}"
          failed: "{{ (delete_poll_summary.failed | default([])) + (poll_chunk_json.failed | default([])) }}"
      vars:
        poll_chunk_json: "{{ (item.stdout_lines | default([]) | select('match', '^\\{') | list | last | default('{}')) | from_json }}"
      loop: "{{ disk_delete_poll.results | default([]) }}"
      loop_control:
        label: "poll_chunk"
      when:
        - not ansible_check_mode
        - disk_delete_poll is defined
        - disk_delete_poll.results is defined

    - name: "Build final delete execution summary"
      ansible.builtin.set_fact:
        disk_delete_execution_summary:
          deleted: "{{ (delete_submit_summary.deleted | default([])) + (delete_poll_summary.deleted | default([])) }}"
          failed: "{{ (delete_submit_summary.submit_failed | default([])) + (delete_poll_summary.failed | default([])) }}"
      when:
        - not ansible_check_mode
        - disk_delete_targets | default([]) | length > 0

    - name: "Print delete submit/poll summary"
      ansible.builtin.debug:
        msg:
          delete_total_targets: "{{ disk_delete_targets | length }}"
          delete_immediate_deleted_count: "{{ delete_submit_summary.deleted | default([]) | length }}"
          delete_queued_task_count: "{{ delete_submit_summary.task_targets | default([]) | length }}"
          delete_submit_failed_count: "{{ delete_submit_summary.submit_failed | default([]) | length }}"
          delete_polled_deleted_count: "{{ delete_poll_summary.deleted | default([]) | length }}"
          delete_polled_failed_count: "{{ delete_poll_summary.failed | default([]) | length }}"
      when:
        - not ansible_check_mode
        - (disk_delete_targets | default([]) | length) > 0

    - name: "Fail when delete execution has failures"
      ansible.builtin.fail:
        msg: "Delete execution failures detected: {{ disk_delete_execution_summary.failed | default([]) }}"
      when:
        - not ansible_check_mode
        - (disk_delete_execution_summary.failed | default([]) | length) > 0

    - name: "Parse delete execution summary"
      ansible.builtin.set_fact:
        disk_delete_execution_summary: "{{ disk_delete_execution_summary | default({'deleted': [], 'failed': []}) }}"
      when:
        - not ansible_check_mode
        - (disk_delete_targets | default([]) | length) > 0

    - name: "Print final disk removal summary"
      ansible.builtin.debug:
        msg:
          matched_vm_count: "{{ matched_vm_ext_ids | length }}"
          disk_custom_attribute: "{{ disk_custom_attribute }}"
          deleted_disk_count: "{{ (disk_delete_execution_summary.deleted | default([]) | length) if not ansible_check_mode else (disk_delete_targets | length) }}"
          failed_disk_count: "{{ (disk_delete_execution_summary.failed | default([]) | length) if not ansible_check_mode else 0 }}"
          skipped_disk_count: 0
          deleted_disks: "{{ (disk_delete_execution_summary.deleted | default([])) if not ansible_check_mode else disk_delete_targets }}"
          failed_disks: "{{ (disk_delete_execution_summary.failed | default([])) if not ansible_check_mode else [] }}"
