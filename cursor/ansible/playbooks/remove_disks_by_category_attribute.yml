    - name: "Poll delete tasks concurrently after submit"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import requests
        import urllib3

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        targets = json.loads(os.environ["DELETE_POLL_TARGETS"])
        username = os.environ["DELETE_POLL_USERNAME"]
        password = os.environ["DELETE_POLL_PASSWORD"]
        retries = int(os.environ["DELETE_POLL_RETRIES"])
        delay = int(os.environ["DELETE_POLL_DELAY"])
        concurrency = int(os.environ["DELETE_POLL_CONCURRENCY"])
        progress_every = int(os.environ["DELETE_PROGRESS_EVERY"])

        terminal_success = {"SUCCEEDED", "COMPLETED", "COMPLETE"}
        terminal_failure = {"FAILED", "ERROR", "CANCELLED"}

        session = requests.Session()
        session.auth = (username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def poll_once(target: dict) -> dict:
            vm_ext_id = target.get("vm_ext_id", "")
            disk_ext_id = target.get("disk_ext_id", "")
            task_url = target.get("task_url", "")
            if not task_url:
                return {
                    "vm_ext_id": vm_ext_id,
                    "disk_ext_id": disk_ext_id,
                    "state": "FAILED",
                    "task_status": "UNKNOWN",
                    "reason": "missing task_url",
                }
            try:
                response = session.get(task_url, timeout=(5, 30))
                response.raise_for_status()
                data = response.json().get("data", {}) or {}
                status = str(data.get("status", "UNKNOWN")).upper()
                if status in terminal_success:
                    return {
                        "vm_ext_id": vm_ext_id,
                        "disk_ext_id": disk_ext_id,
                        "state": "SUCCEEDED",
                        "task_status": status,
                    }
                if status in terminal_failure:
                    messages = data.get("errorMessages", []) or []
                    reason = ((messages[0] or {}).get("message", "")) if messages else ""
                    return {
                        "vm_ext_id": vm_ext_id,
                        "disk_ext_id": disk_ext_id,
                        "state": "FAILED",
                        "task_status": status,
                        "reason": reason or f"Delete task ended with status {status}",
                    }
                return {
                    "vm_ext_id": vm_ext_id,
                    "disk_ext_id": disk_ext_id,
                    "state": "PENDING",
                    "task_status": status,
                }
            except Exception as exc:
                return {
                    "vm_ext_id": vm_ext_id,
                    "disk_ext_id": disk_ext_id,
                    "state": "PENDING",
                    "task_status": "UNKNOWN",
                    "reason": str(exc),
                }

        deleted = []
        failed = []
        total = len(targets)
        print(f"PROGRESS stage=delete_poll total={total}", flush=True)
        pending = [
            {
                "vm_ext_id": t.get("vm_ext_id", ""),
                "disk_ext_id": t.get("disk_ext_id", ""),
                "task_url": t.get("task_url", ""),
                "attempts": 0,
                "last_status": "UNKNOWN",
                "last_reason": "",
            }
            for t in targets
        ]
        round_no = 0

        while pending:
            round_no += 1
            for t in pending:
                t["attempts"] += 1

            with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
                futures = [executor.submit(poll_once, target) for target in pending]
                results = [future.result() for future in concurrent.futures.as_completed(futures)]

            next_pending = []
            result_by_key = {
                f"{r.get('vm_ext_id','')}:{r.get('disk_ext_id','')}": r
                for r in results
            }

            for target in pending:
                key = f"{target.get('vm_ext_id','')}:{target.get('disk_ext_id','')}"
                result = result_by_key.get(key, {})
                state = result.get("state", "PENDING")
                task_status = result.get("task_status", target.get("last_status", "UNKNOWN"))
                reason = result.get("reason", target.get("last_reason", ""))
                target["last_status"] = task_status
                target["last_reason"] = reason

                if state == "SUCCEEDED":
                    deleted.append(
                        {
                            "vm_ext_id": target.get("vm_ext_id", ""),
                            "disk_ext_id": target.get("disk_ext_id", ""),
                            "task_status": task_status,
                        }
                    )
                elif state == "FAILED":
                    failed.append(
                        {
                            "vm_ext_id": target.get("vm_ext_id", ""),
                            "disk_ext_id": target.get("disk_ext_id", ""),
                            "task_status": task_status,
                            "reason": reason or "Delete task failed",
                        }
                    )
                else:
                    if target["attempts"] >= retries:
                        failed.append(
                            {
                                "vm_ext_id": target.get("vm_ext_id", ""),
                                "disk_ext_id": target.get("disk_ext_id", ""),
                                "task_status": task_status,
                                "reason": reason or "Delete task poll retries exhausted",
                            }
                        )
                    else:
                        next_pending.append(target)

            processed = len(deleted) + len(failed)
            if (processed % progress_every == 0) or (processed == total):
                print(
                    f"PROGRESS stage=delete_poll processed={processed}/{total} deleted={len(deleted)} failed={len(failed)} pending={len(next_pending)} round={round_no}",
                    flush=True,
                )

            pending = next_pending
            if pending:
                time.sleep(delay)

        print(json.dumps({"deleted": deleted, "failed": failed}))
