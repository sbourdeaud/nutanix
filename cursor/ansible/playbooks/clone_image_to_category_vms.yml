    - name: "Write clone submit payload"
      ansible.builtin.copy:
        dest: "{{ image_clone_submit_payload_file.path }}"
        mode: "0600"
        content: "{{ {'targets': (target_clone_apply | default([])), 'clone_etag_by_vm': (clone_etag_by_vm | default({})), 'source_image_ext_id': source_image_ext_id, 'clone_disk_bus_type': clone_disk_bus_type, 'source_disk_custom_attribute': source_disk_custom_attribute} | to_json }}"
      delegate_to: localhost
