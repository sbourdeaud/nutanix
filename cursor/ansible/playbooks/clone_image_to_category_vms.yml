    - name: "Clone source image to eligible target VMs concurrently"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time
        import uuid

        import requests
        import urllib3
        from requests.auth import HTTPBasicAuth
        from requests.adapters import HTTPAdapter
        from urllib3.util.retry import Retry

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["CLONE_SUBMIT_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        targets = payload.get("targets", []) or []
        clone_etag_by_vm = payload.get("clone_etag_by_vm", {}) or {}
        source_image_ext_id = payload.get("source_image_ext_id", "")
        clone_disk_bus_type = payload.get("clone_disk_bus_type", "SCSI")
        source_disk_custom_attribute = payload.get("source_disk_custom_attribute", "")

        base_url = os.environ["CLONE_SUBMIT_BASE_URL"].rstrip("/")
        username = os.environ["CLONE_SUBMIT_USERNAME"]
        password = os.environ["CLONE_SUBMIT_PASSWORD"]
        retries = int(os.environ["CLONE_SUBMIT_RETRIES"])
        retry_delay = int(os.environ["CLONE_SUBMIT_RETRY_DELAY"])
        concurrency = int(os.environ["CLONE_SUBMIT_CONCURRENCY"])
        rate_limit_backoff_max = int(os.environ.get("CLONE_SUBMIT_RATE_LIMIT_BACKOFF_MAX", "30"))
        rate_limit_retry_rounds = int(os.environ.get("CLONE_SUBMIT_RATE_LIMIT_RETRY_ROUNDS", "2"))

        session = requests.Session()
        session.auth = HTTPBasicAuth(username, password)
        session.verify = False
        adapter = HTTPAdapter(max_retries=Retry(total=0))
        session.mount("https://", adapter)
        session.mount("http://", adapter)

        def compute_backoff_seconds(attempt_idx: int, response=None) -> float:
            retry_after = ""
            if response is not None:
                retry_after = (response.headers.get("Retry-After", "") or "").strip()
            if retry_after.isdigit():
                return float(min(rate_limit_backoff_max, max(1, int(retry_after))))
            base = max(1, retry_delay)
            return float(min(rate_limit_backoff_max, base * (2 ** attempt_idx)))

        def submit_clone(target: dict):
            vm_ext_id = target.get("vm_ext_id", "")
            vm_name = target.get("vm_name", vm_ext_id)
            if not vm_ext_id:
                return {"ok": False, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "reason": "Missing vm_ext_id"}

            url = f"{base_url}/api/vmm/v4.0/ahv/config/vms/{vm_ext_id}/disks"
            if_match = clone_etag_by_vm.get(vm_ext_id, "")
            body = {
                "$objectType": "vmm.v4.ahv.config.Disk",
                "$backingInfoItemDiscriminator": "vmm.v4.ahv.config.VmDisk",
                "customAttributes": [source_disk_custom_attribute] if source_disk_custom_attribute else [],
                "diskAddress": {
                    "$objectType": "vmm.v4.ahv.config.DiskAddress",
                    "busType": clone_disk_bus_type,
                },
                "backingInfo": {
                    "$objectType": "vmm.v4.ahv.config.VmDisk",
                    "dataSource": {
                        "$objectType": "vmm.v4.ahv.config.DataSource",
                        "reference": {
                            "$objectType": "vmm.v4.ahv.config.ImageReference",
                            "imageExtId": source_image_ext_id,
                        },
                    },
                },
            }

            last_error = ""
            for attempt_idx in range(retries):
                headers = {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "Cache-Control": "no-cache",
                    "NTNX-Request-Id": str(uuid.uuid4()),
                }
                if if_match:
                    headers["If-Match"] = if_match
                try:
                    response = session.post(url, headers=headers, json=body, timeout=(5, 45))
                    if response.status_code in (200, 201, 202):
                        task_ext_id = (response.json().get("data", {}) or {}).get("extId", "")
                        if task_ext_id:
                            return {"ok": True, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "task_ext_id": task_ext_id}
                        last_error = "clone accepted but no task extId"
                        time.sleep(max(1, retry_delay))
                        continue
                    if response.status_code == 429:
                        last_error = f"HTTP 429: {response.text}"
                        time.sleep(compute_backoff_seconds(attempt_idx, response))
                        continue
                    last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(max(1, retry_delay))
            return {"ok": False, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "reason": last_error or "clone submit failed"}

        def submit_targets(pending_targets: list[dict]):
            stage_success = []
            stage_failed = []
            with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
                futures = [executor.submit(submit_clone, target) for target in pending_targets]
                for future in concurrent.futures.as_completed(futures):
                    result = future.result()
                    if result.get("ok", False):
                        stage_success.append(result)
                    else:
                        stage_failed.append(result)
            return stage_success, stage_failed

        all_success = []
        pending = targets
        final_failed = []
        for _round in range(rate_limit_retry_rounds + 1):
            if not pending:
                break
            stage_success, stage_failed = submit_targets(pending)
            all_success.extend(stage_success)
            pending = [
                {
                    "vm_ext_id": item.get("vm_ext_id", ""),
                    "vm_name": item.get("vm_name", ""),
                }
                for item in stage_failed
                if item.get("vm_ext_id", "")
            ]
            final_failed = stage_failed

        print(
            json.dumps(
                {
                    "task_targets": [
                        {
                            "vm_ext_id": item.get("vm_ext_id", ""),
                            "vm_name": item.get("vm_name", ""),
                            "task_ext_id": item.get("task_ext_id", ""),
                        }
                        for item in all_success
                    ],
                    "failed": final_failed if pending else [],
                }
            )
        )
        PY
      register: clone_submit_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        CLONE_SUBMIT_PAYLOAD_FILE: "{{ image_clone_submit_payload_file.path }}"
        CLONE_SUBMIT_BASE_URL: "{{ prism_base_url }}"
        CLONE_SUBMIT_USERNAME: "{{ pc_username }}"
        CLONE_SUBMIT_PASSWORD: "{{ pc_password }}"
        CLONE_SUBMIT_RETRIES: "{{ api_retries | int }}"
        CLONE_SUBMIT_RETRY_DELAY: "{{ api_retry_delay_seconds | int }}"
        CLONE_SUBMIT_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
        CLONE_SUBMIT_RATE_LIMIT_BACKOFF_MAX: "30"
        CLONE_SUBMIT_RATE_LIMIT_RETRY_ROUNDS: "2"
      when:
        - not ansible_check_mode
        - (target_clone_apply | default([]) | length) > 0

    - name: "Remove temporary clone submit payload file"
