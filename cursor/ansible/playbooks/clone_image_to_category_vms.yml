    - name: "Write clone task polling payload"
      ansible.builtin.copy:
        dest: "{{ image_clone_poll_payload_file.path }}"
        mode: "0600"
        content: "{{ {'clone_task_targets': (clone_task_targets | default([]))} | to_json }}"
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - not ansible_check_mode
        - (clone_task_targets | default([]) | length) > 0

    - name: "Poll clone tasks concurrently until terminal state"
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import concurrent.futures
        import json
        import os
        import time

        import requests
        import urllib3
        from requests.auth import HTTPBasicAuth

        urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

        payload_file = os.environ["CLONE_POLL_PAYLOAD_FILE"]
        with open(payload_file, "r", encoding="utf-8") as f:
            payload = json.load(f)

        targets = payload.get("clone_task_targets", []) or []
        base_url = os.environ["CLONE_POLL_BASE_URL"].rstrip("/")
        username = os.environ["CLONE_POLL_USERNAME"]
        password = os.environ["CLONE_POLL_PASSWORD"]
        retries = int(os.environ["CLONE_POLL_RETRIES"])
        delay_seconds = int(os.environ["CLONE_POLL_DELAY"])
        concurrency = int(os.environ["CLONE_POLL_CONCURRENCY"])

        terminal_success = {"SUCCEEDED", "COMPLETED", "COMPLETE"}
        terminal_failure = {"FAILED", "ERROR", "CANCELLED"}

        session = requests.Session()
        session.auth = HTTPBasicAuth(username, password)
        session.verify = False
        session.headers.update({"Accept": "application/json", "Content-Type": "application/json", "Cache-Control": "no-cache"})

        def poll_target(target: dict):
            vm_ext_id = target.get("vm_ext_id", "")
            vm_name = target.get("vm_name", vm_ext_id)
            task_ext_id = target.get("task_ext_id", "")
            if not task_ext_id:
                return {"ok": False, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "reason": "Missing task_ext_id"}
            url = f"{base_url}/api/prism/v4.0/config/tasks/{task_ext_id}"
            last_status = "UNKNOWN"
            last_error = ""
            for _ in range(retries):
                try:
                    response = session.get(url, timeout=(5, 45))
                    if response.status_code == 200:
                        task_json = response.json()
                        status = str(((task_json.get("data", {}) or {}).get("status", task_json.get("status", "UNKNOWN")))).upper()
                        last_status = status
                        if status in terminal_success:
                            return {"ok": True, "vm_ext_id": vm_ext_id, "vm_name": vm_name}
                        if status in terminal_failure:
                            return {"ok": False, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "reason": f"terminal status {status}"}
                    else:
                        last_error = f"HTTP {response.status_code}: {response.text}"
                except Exception as exc:
                    last_error = str(exc)
                time.sleep(max(1, delay_seconds))
            return {"ok": False, "vm_ext_id": vm_ext_id, "vm_name": vm_name, "reason": last_error or f"poll timeout status={last_status}"}

        failed = []
        with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, concurrency)) as executor:
            futures = [executor.submit(poll_target, target) for target in targets]
            for future in concurrent.futures.as_completed(futures):
                result = future.result()
                if not result.get("ok", False):
                    failed.append(result)

        print(json.dumps({"failed": failed}))
        PY
      register: clone_poll_raw
      delegate_to: localhost
      check_mode: false
      no_log: true
      environment:
        CLONE_POLL_PAYLOAD_FILE: "{{ image_clone_poll_payload_file.path }}"
        CLONE_POLL_BASE_URL: "{{ prism_base_url }}"
        CLONE_POLL_USERNAME: "{{ pc_username }}"
        CLONE_POLL_PASSWORD: "{{ pc_password }}"
        CLONE_POLL_RETRIES: "{{ task_poll_retries | int }}"
        CLONE_POLL_DELAY: "{{ task_poll_delay_seconds | int }}"
        CLONE_POLL_CONCURRENCY: "{{ disk_fetch_concurrency | int }}"
      when:
        - not ansible_check_mode
        - (clone_task_targets | default([]) | length) > 0

    - name: "Remove temporary clone task polling payload file"
