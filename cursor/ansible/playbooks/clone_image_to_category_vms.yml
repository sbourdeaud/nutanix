        path: "{{ image_clone_poll_payload_file.path }}"
        state: absent
      delegate_to: localhost
      check_mode: false
      no_log: true
      when:
        - not ansible_check_mode
        - (clone_task_targets | default([]) | length) > 0

    - name: "Set clone poll failures"
      ansible.builtin.set_fact:
        clone_poll_failed: "{{ (clone_poll_raw.stdout | from_json).failed | default([]) }}"
      when:
