      no_log: true
      when:
        - not ansible_check_mode
        - (target_clone_apply | default([]) | length) > 0

    - name: "Set clone task targets"
      ansible.builtin.set_fact:
        clone_task_targets: "{{ (clone_submit_raw.stdout | from_json).task_targets | default([]) }}"
        clone_submit_failed: "{{ (clone_submit_raw.stdout | from_json).failed | default([]) }}"
      when:
        - not ansible_check_mode
        - (target_clone_apply | default([]) | length) > 0

    - name: "Fail when clone submit has unresolved failures"
      ansible.builtin.fail:
        msg: "Failed to submit clone tasks for target VMs: {{ clone_submit_failed }}"
      when:
        - not ansible_check_mode
        - (clone_submit_failed | default([]) | length) > 0

    - name: "Create temporary file for clone task polling payload"
      ansible.builtin.tempfile:
        state: file
        suffix: "_image_clone_poll_payload.json"
      register: image_clone_poll_payload_file
      delegate_to: localhost
